<script>
"use strict";
/* ==================================================================================
   TABLAS AUXILIARES
   ================================================================================== */
function th(etiqueta, indice, clave, clases){
  const o = ESTADO.orden[clave];
  let cls = "ordenable " + (clases || "");
  if (o && o.col === indice) cls += o.dir === 1 ? " ord-asc" : " ord-desc";
  const ind = (o && o.col === indice) ? (o.dir === 1 ? "▲" : "▼") : "⇅";
  return '<th class="' + cls.trim() + '" data-col="' + indice + '">' + escapar(etiqueta) + '<span class="ind">' + ind + "</span></th>";
}
function activarOrden(cont, clave, redibujar){
  cont.querySelectorAll("th.ordenable").forEach(el => {
    el.addEventListener("click", () => {
      const col = +el.dataset.col;
      const o = ESTADO.orden[clave];
      ESTADO.orden[clave] = (o && o.col === col) ? { col, dir: -o.dir } : { col, dir: col === 0 ? 1 : -1 };
      redibujar();
    });
  });
}
/** null siempre al final, sin importar la dirección. */
function comparar(a, b, dir){
  const na = (a === null || a === undefined || !Number.isFinite(a));
  const nb = (b === null || b === undefined || !Number.isFinite(b));
  if (na && nb) return 0;
  if (na) return 1;
  if (nb) return -1;
  return (a - b) * dir;
}

/** Tabla simple de un desglose, con porcentaje y barra de proporción. */
function tablaDesglose(id, lista, etiquetaCol, etiquetaValor){
  const cont = document.getElementById(id);
  if (!cont) return;
  if (!lista.length){ cont.innerHTML = '<div class="vacio">Sin datos en el período seleccionado.</div>'; return; }
  const suma = lista.reduce((t, x) => t + x.valor, 0);
  const max = Math.max(...lista.map(x => x.valor));
  let html = '<table class="datos compacta"><thead><tr><th class="izq">' + escapar(etiquetaCol) +
    "</th><th>" + escapar(etiquetaValor) + "</th><th>%</th></tr></thead><tbody>";
  lista.forEach(x => {
    html += '<tr><td class="izq normal">' + escapar(x.etiqueta) + "</td><td>" + fmt(x.valor) +
      '<span class="barra-prop"><i style="width:' + (max ? (x.valor / max) * 100 : 0) + '%"></i></span></td>' +
      "<td>" + pct(x.valor, suma) + "</td></tr>";
  });
  html += "</tbody><tfoot><tr><td class='izq'>Total</td><td>" + fmt(suma) + "</td><td>100,0%</td></tr></tfoot></table>";
  cont.innerHTML = html;
}

/** Proporción de un valor de dimensión sobre el total, por sede. */
function tablaProporcionSede(id, idInd, dim, valorDim, etiqueta, etiquetaPct){
  const cont = document.getElementById(id);
  if (!cont) return;
  const { ref } = anios();
  const meses = mesesSeleccionados();
  const porSede = desglosePorSede(idInd, dim, valorDim, { anio: ref, meses });
  const filas = sedesVisibles().map(s => {
    const parte = porSede.get(s) || 0;
    const tot = total(idInd, { anio: ref, meses, sede: s });
    return { sede: s, parte, total: tot, prop: tot ? parte / tot : null };
  }).filter(x => x.total).sort((a, b) => (b.prop || 0) - (a.prop || 0));

  if (!filas.length){ cont.innerHTML = '<div class="vacio">Sin datos.</div>'; return; }
  let html = '<table class="datos compacta"><thead><tr><th class="izq">Sede</th><th>' + escapar(etiqueta) +
    "</th><th>Total</th><th>" + escapar(etiquetaPct) + "</th></tr></thead><tbody>";
  filas.forEach(f => {
    html += '<tr><td class="izq normal">' + escapar(f.sede) + "</td><td>" + fmt(f.parte) + "</td><td>" + fmt(f.total) +
      "</td><td>" + (f.prop === null ? "—" : FMT_DECIMAL.format(f.prop * 100) + "%") +
      '<span class="barra-prop"><i style="width:' + ((f.prop || 0) * 100) + '%"></i></span></td></tr>';
  });
  const tp = filas.reduce((t, f) => t + f.parte, 0), tt = filas.reduce((t, f) => t + f.total, 0);
  html += "</tbody><tfoot><tr><td class='izq'>Sistema</td><td>" + fmt(tp) + "</td><td>" + fmt(tt) +
    "</td><td>" + pct(tp, tt) + "</td></tr></tfoot></table>";
  cont.innerHTML = html;
}

/** Lugar de la transacción por sede: volumen y porcentaje de cada modalidad. */
function tablaModalidades(id, idInd){
  const cont = document.getElementById(id);
  if (!cont) return;
  const { ref } = anios();
  const meses = mesesSeleccionados();
  const mods = CONFIG.criterios.modalidadesAtencion;
  const porMod = mods.map(m => desglosePorSede(idInd, "estacion", m, { anio: ref, meses }));

  const filas = sedesVisibles().map(s => {
    const vals = porMod.map(m => m.get(s) || 0);
    const suma = vals.reduce((a, b) => a + b, 0);
    return { sede: s, vals, suma };
  }).filter(x => x.suma > 0);

  if (!filas.length){ cont.innerHTML = '<div class="vacio">Sin datos.</div>'; return; }

  const o = ESTADO.orden.modalidades;
  if (o){
    if (o.col === 0) filas.sort((a, b) => a.sede.localeCompare(b.sede, "es") * o.dir);
    else {
      const i = o.col - 1;
      /* Las columnas impares son volumen y las pares, porcentaje de esa modalidad. */
      const iMod = Math.floor(i / 2), esPct = (i % 2) === 1;
      filas.sort((a, b) => comparar(esPct ? a.vals[iMod] / a.suma : a.vals[iMod],
                                    esPct ? b.vals[iMod] / b.suma : b.vals[iMod], o.dir));
    }
  } else {
    /* Por defecto: mayor adopción de autopréstamo primero. */
    const iAuto = mods.findIndex(m => /autoprestamo/.test(norm(m)));
    if (iAuto !== -1) filas.sort((a, b) => (b.vals[iAuto] / b.suma) - (a.vals[iAuto] / a.suma));
  }

  const nombreCorto = m => {
    const n = norm(m);
    if (n.includes("meson")) return "Mesón";
    if (n.includes("linea")) return "En línea";
    if (n.includes("autoprestamo")) return "Autopréstamo";
    return m;
  };

  let html = '<table class="datos compacta"><thead><tr>' + th("Sede", 0, "modalidades", "izq");
  let c = 1;
  mods.forEach(m => { html += th(nombreCorto(m), c++, "modalidades", "sep-izq") + th("%", c++, "modalidades", ""); });
  html += "</tr></thead><tbody>";
  filas.forEach(f => {
    html += '<tr><td class="izq normal">' + escapar(f.sede) + "</td>";
    f.vals.forEach(v => {
      html += '<td class="sep-izq">' + fmt(v) + "</td><td>" + pct(v, f.suma) + "</td>";
    });
    html += "</tr>";
  });
  const tot = mods.map((_, i) => filas.reduce((t, f) => t + f.vals[i], 0));
  const totSuma = tot.reduce((a, b) => a + b, 0);
  html += "</tbody><tfoot><tr><td class='izq'>Sistema</td>";
  tot.forEach(v => { html += '<td class="sep-izq">' + fmt(v) + "</td><td>" + pct(v, totSuma) + "</td>"; });
  html += "</tr></tfoot></table>";
  cont.innerHTML = html;
  activarOrden(cont, "modalidades", () => tablaModalidades(id, idInd));
}

/** Matriz sede × mes del indicador, con total del período. */
function tablaMensualPorSede(id, idInd){
  const cont = document.getElementById(id);
  if (!cont) return;
  const { ref } = anios();
  const meses = mesesConDatos(ref);
  const sedes = sedesVisibles();
  if (!sedes.length || !meses.length){ cont.innerHTML = '<div class="vacio">Sin datos.</div>'; return; }
  const sel = new Set(mesesSeleccionados());

  const filas = sedes.map(s => ({
    sede: s,
    vals: meses.map(m => total(idInd, { anio: ref, meses: [m], sede: s })),
    tot: total(idInd, { anio: ref, meses: mesesSeleccionados(), sede: s })
  }));

  const o = ESTADO.orden.cpMensual;
  if (o){
    if (o.col === 0) filas.sort((a, b) => a.sede.localeCompare(b.sede, "es") * o.dir);
    else if (o.col === meses.length + 1) filas.sort((a, b) => comparar(a.tot, b.tot, o.dir));
    else filas.sort((a, b) => comparar(a.vals[o.col - 1], b.vals[o.col - 1], o.dir));
  }

  let html = '<table class="datos"><thead><tr>' + th("Sede", 0, "cpMensual", "izq");
  meses.forEach((m, i) => { html += th(CONFIG.mesesCortos[m - 1], i + 1, "cpMensual", sel.has(m) ? "" : ""); });
  html += th("Período", meses.length + 1, "cpMensual", "sep-izq") + "</tr></thead><tbody>";
  filas.forEach(f => {
    html += '<tr><td class="izq">' + escapar(f.sede) + "</td>";
    f.vals.forEach(v => { html += "<td>" + fmt(v) + "</td>"; });
    html += '<td class="sep-izq">' + fmt(f.tot) + "</td></tr>";
  });
  html += "</tbody><tfoot><tr><td class='izq'>Total sistema</td>";
  meses.forEach(m => { html += "<td>" + fmt(total(idInd, { anio: ref, meses: [m] })) + "</td>"; });
  html += '<td class="sep-izq">' + fmt(total(idInd, { anio: ref, meses: mesesSeleccionados() })) + "</td></tr></tfoot></table>";
  cont.innerHTML = html;
  activarOrden(cont, "cpMensual", () => tablaMensualPorSede(id, idInd));
}

/* ==================================================================================
   GRÁFICOS
   ================================================================================== */
Chart.defaults.font.family = "'Lato', sans-serif";
Chart.defaults.font.size = 11;
Chart.defaults.color = "#606060";
Chart.defaults.animation = false;

function destruir(id){
  if (ESTADO.graficos[id]){ ESTADO.graficos[id].destroy(); delete ESTADO.graficos[id]; }
}
function ctx(id){
  const c = document.getElementById(id);
  if (!c) return null;
  destruir(id);
  return c;
}
const ejeY = { beginAtZero: true, grid: { color: "#EFEFEF" }, border: { display: false },
               ticks: { callback: v => FMT_ENTERO.format(v) } };
const ejeX = { grid: { display: false }, border: { color: "#C9C9C9" } };
const tooltipBase = { backgroundColor: "#000", titleFont: { weight: "900" }, padding: 10, cornerRadius: 2 };

/** Líneas: año actual vs. año anterior. */
function dibujarEvolucion(idCanvas, idInd, metrica){
  const c = ctx(idCanvas); if (!c) return;
  const { ref, prev, hayPrev } = anios();
  const serieRef = serieMensual(idInd, ref, metrica);
  const seriePrev = hayPrev ? serieMensual(idInd, prev, metrica) : null;
  const datasets = [];
  if (seriePrev) datasets.push({
    label: String(prev), data: seriePrev, borderColor: CONFIG.colores.grisSerie,
    backgroundColor: CONFIG.colores.grisSerie, borderWidth: 2, borderDash: [5, 4],
    pointRadius: 2.5, pointHoverRadius: 5, tension: .18, spanGaps: false });
  datasets.push({
    label: String(ref), data: serieRef, borderColor: CONFIG.colores.negro,
    backgroundColor: CONFIG.colores.negro, borderWidth: 2.5, pointRadius: 3, pointHoverRadius: 6,
    pointBackgroundColor: CONFIG.colores.amarillo, pointBorderColor: CONFIG.colores.negro,
    pointBorderWidth: 1.5, tension: .18, spanGaps: false });

  ESTADO.graficos[idCanvas] = new Chart(c, {
    type: "line",
    data: { labels: CONFIG.mesesCortos, datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: { position: "top", align: "end", labels: { boxWidth: 14, boxHeight: 2, padding: 12 } },
        tooltip: Object.assign({}, tooltipBase, { callbacks: {
          title: it => nombreMes(it[0].dataIndex + 1),
          label: it => it.dataset.label + ": " + (it.parsed.y === null ? "sin dato" : FMT_ENTERO.format(it.parsed.y)),
          afterBody: it => {
            if (!seriePrev) return "";
            const v = variacion(serieRef[it[0].dataIndex], seriePrev[it[0].dataIndex]);
            return v === null ? "Variación interanual: n/a"
              : "Variación interanual: " + (v > 0 ? "+" : "") + FMT_DECIMAL.format(v) + "%";
          }
        }})
      },
      scales: { x: ejeX, y: ejeY }
    }
  });
}

/** Barras horizontales del total por sede, ordenadas de mayor a menor. */
function dibujarBarrasSede(idCanvas, idInd, metrica){
  const { ref, prev, hayPrev } = anios();
  const meses = mesesSeleccionados();
  const filas = sedesVisibles().map(s => ({
    etiqueta: s,
    valor: total(idInd, { anio: ref, meses, sede: s }),
    anterior: hayPrev ? total(idInd, { anio: prev, meses, sede: s }) : null
  })).sort((a, b) => comparar(a.valor, b.valor, -1));
  dibujarBarrasHorizontal(idCanvas, filas, "Total", hayPrev ? { prev, etiquetaPrev: String(prev) } : null);
}

/** Serie mensual de un valor concreto de una dimensión (ej. solo PRÉSTAMO). */
function dibujarSerieDimension(idCanvas, idInd, dim, valorDim, etiqueta){
  const c = ctx(idCanvas); if (!c) return;
  const { ref, prev, hayPrev } = anios();
  const serie = (anio) => {
    const s = new Array(12).fill(null);
    for (let m = 1; m <= 12; m++){
      const porSede = desglosePorSede(idInd, dim, valorDim, { anio, meses: [m] });
      let t = null;
      porSede.forEach(v => { t = (t === null ? 0 : t) + v; });
      s[m - 1] = t;
    }
    return s;
  };
  const sRef = serie(ref), sPrev = hayPrev ? serie(prev) : null;
  const datasets = [];
  if (sPrev) datasets.push({ label: String(prev), data: sPrev, borderColor: CONFIG.colores.grisSerie,
    backgroundColor: CONFIG.colores.grisSerie, borderWidth: 2, borderDash: [5, 4], pointRadius: 2.5, tension: .18 });
  datasets.push({ label: String(ref), data: sRef, borderColor: CONFIG.colores.negro,
    backgroundColor: CONFIG.colores.negro, borderWidth: 2.5, pointRadius: 3,
    pointBackgroundColor: CONFIG.colores.amarillo, pointBorderColor: CONFIG.colores.negro, pointBorderWidth: 1.5, tension: .18 });

  ESTADO.graficos[idCanvas] = new Chart(c, {
    type: "line",
    data: { labels: CONFIG.mesesCortos, datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: "index", intersect: false },
      plugins: {
        title: { display: true, text: etiqueta, align: "start", font: { weight: "900", size: 11 }, color: "#111" },
        legend: { position: "top", align: "end", labels: { boxWidth: 14, boxHeight: 2, padding: 10 } },
        tooltip: Object.assign({}, tooltipBase, { callbacks: {
          title: it => nombreMes(it[0].dataIndex + 1),
          label: it => it.dataset.label + ": " + (it.parsed.y === null ? "sin dato" : FMT_ENTERO.format(it.parsed.y))
        }})
      },
      scales: { x: ejeX, y: ejeY }
    }
  });
}

/** Barras por sede de un valor concreto de una dimensión. */
function dibujarBarrasDimensionSede(idCanvas, idInd, dim, valorDim, etiqueta){
  const { ref } = anios();
  const porSede = desglosePorSede(idInd, dim, valorDim, { anio: ref, meses: mesesSeleccionados() });
  const filas = sedesVisibles().map(s => ({ etiqueta: s, valor: porSede.get(s) || 0 }))
                               .sort((a, b) => b.valor - a.valor);
  dibujarBarrasHorizontal(idCanvas, filas, etiqueta);
}

/**
 * Barras horizontales genéricas.
 * @param {Array} lista  [{etiqueta, valor, anterior?}]
 */
function dibujarBarrasHorizontal(idCanvas, lista, etiquetaValor, comparacion){
  const c = ctx(idCanvas); if (!c) return;
  const cont = c.parentElement;
  if (!lista.length){ cont.innerHTML = '<div class="vacio">Sin datos en el período seleccionado.</div>'; return; }

  const datasets = [];
  if (comparacion){
    datasets.push({ label: comparacion.etiquetaPrev, data: lista.map(x => x.anterior),
      backgroundColor: CONFIG.colores.grisSerie, borderWidth: 0, barPercentage: .82, categoryPercentage: .72 });
  }
  datasets.push({
    label: etiquetaValor, data: lista.map(x => x.valor),
    backgroundColor: lista.map(x => (x.esResto || x.esNoAplica) ? CONFIG.colores.grisSerie : CONFIG.colores.amarillo),
    borderColor: CONFIG.colores.negro, borderWidth: 1, barPercentage: .82, categoryPercentage: .72
  });

  const suma = lista.reduce((t, x) => t + (x.valor || 0), 0);
  ESTADO.graficos[idCanvas] = new Chart(c, {
    type: "bar",
    data: { labels: lista.map(x => x.etiqueta), datasets },
    options: {
      indexAxis: "y", responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: !!comparacion, position: "top", align: "end", labels: { boxWidth: 12, boxHeight: 12, padding: 10 } },
        tooltip: Object.assign({}, tooltipBase, { callbacks: {
          label: it => it.dataset.label + ": " + (it.parsed.x === null ? "sin dato" : FMT_ENTERO.format(it.parsed.x)),
          afterBody: it => {
            const x = lista[it[0].dataIndex];
            const partes = [];
            if (suma) partes.push("Participación: " + pct(x.valor, suma));
            if (comparacion && x.anterior !== null && x.anterior !== undefined){
              const v = variacion(x.valor, x.anterior);
              partes.push("Variación interanual: " + (v === null ? "n/a" : (v > 0 ? "+" : "") + FMT_DECIMAL.format(v) + "%"));
            }
            return partes.join("\n");
          }
        }})
      },
      scales: {
        x: { beginAtZero: true, grid: { color: "#EFEFEF" }, border: { display: false },
             ticks: { callback: v => FMT_ENTERO.format(v) } },
        y: { grid: { display: false }, border: { color: "#C9C9C9" },
             ticks: { autoSkip: false, font: { size: 10.5 },
                      callback: function(v){ const t = this.getLabelForValue(v); return t.length > 34 ? t.slice(0, 33) + "…" : t; } } }
      }
    }
  });
}

/** Anillo para distribuciones de pocas categorías. */
function dibujarTorta(idCanvas, lista){
  const c = ctx(idCanvas); if (!c) return;
  const cont = c.parentElement;
  if (!lista.length){ cont.innerHTML = '<div class="vacio">Sin datos en el período seleccionado.</div>'; return; }
  const datos = recortarTop(lista, 8, "Otros");
  const suma = datos.reduce((t, x) => t + x.valor, 0);
  ESTADO.graficos[idCanvas] = new Chart(c, {
    type: "doughnut",
    data: {
      labels: datos.map(x => x.etiqueta),
      datasets: [{ data: datos.map(x => x.valor),
        backgroundColor: datos.map((_, i) => CONFIG.colores.categorias[i % CONFIG.colores.categorias.length]),
        borderColor: "#FFFFFF", borderWidth: 2 }]
    },
    options: {
      responsive: true, maintainAspectRatio: false, cutout: "52%",
      plugins: {
        legend: { position: "right", labels: { boxWidth: 11, boxHeight: 11, padding: 9, font: { size: 11 } } },
        tooltip: Object.assign({}, tooltipBase, { callbacks: {
          label: it => it.label + ": " + FMT_ENTERO.format(it.parsed) + " (" + pct(it.parsed, suma) + ")"
        }})
      }
    }
  });
}

/* ==================================================================================
   EXPORTACIÓN A PDF
   window.print() con hoja @media print dedicada: las tablas salen como tablas reales
   (texto seleccionable, sin pixelado) y los canvas se imprimen a resolución nativa.
   ================================================================================== */
function nombreArchivoPdf(){
  const ind = indicadorDe(ESTADO.vistaActiva);
  const vista = ESTADO.vistaActiva === "resumen" ? "resumen" : (ind ? ind.archivoPdf : ESTADO.vistaActiva);
  const periodo = esAcumulado()
    ? "acumulado-" + ESTADO.filtros.anio
    : CONFIG.meses[ESTADO.filtros.mes - 1].toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "") + "-" + ESTADO.filtros.anio;
  return "bibliotecas-" + vista + "-" + periodo + ".pdf";
}

function exportarPdf(){
  const ind = indicadorDe(ESTADO.vistaActiva);
  document.getElementById("imp-vista").textContent =
    ESTADO.vistaActiva === "resumen" ? "Resumen de indicadores" : (ind ? ind.nombre : "");
  document.getElementById("imp-periodo").textContent = etiquetaSeleccion() + (esAcumulado() ? " (acumulado)" : "");
  document.getElementById("imp-generado").textContent =
    new Date().toLocaleDateString("es-CL") + " a las " +
    new Date().toLocaleTimeString("es-CL", { hour: "2-digit", minute: "2-digit" });
  document.getElementById("imp-filtros").textContent = textoFiltros();

  const titulo = document.title;
  document.title = nombreArchivoPdf().replace(/\.pdf$/, "");
  const restaurar = () => {
    document.title = titulo;
    Object.values(ESTADO.graficos).forEach(g => { try { g.resize(); } catch(e){} });
  };
  Object.values(ESTADO.graficos).forEach(g => { try { g.resize(); } catch(e){} });
  window.addEventListener("afterprint", restaurar, { once: true });
  setTimeout(() => { window.print(); }, 150);
  setTimeout(restaurar, 4000);
}

if (window.matchMedia){
  const mq = window.matchMedia("print");
  const h = () => Object.values(ESTADO.graficos).forEach(g => { try { g.resize(); } catch(e){} });
  if (mq.addEventListener) mq.addEventListener("change", h);
  else if (mq.addListener) mq.addListener(h);
}

/* ==================================================================================
   ARRANQUE
   ================================================================================== */
async function iniciar(){
  const capa = document.getElementById("capa-carga");
  const detalle = document.getElementById("detalle-carga");
  try {
    detalle.textContent = "Descargando y agregando las hojas del libro. La primera carga puede tardar unos segundos.";
    await cargarTodo();
  } catch (e){
    anotar("Sistema", "Error inesperado durante la carga: " + e.message);
  }

  const algunaOk = CONFIG.indicadores.some(i => ESTADO.datos[i.id] && ESTADO.datos[i.id].estado === "ok");
  if (!algunaOk){
    const diagnostico = esOrigenLocal()
      ? "<strong>El dashboard se abrió como archivo local (file://)</strong>" +
        "Por seguridad, el navegador no deja que una página abierta desde el disco descargue datos de Google. " +
        "Necesita servirse desde una dirección web: súbelo a GitHub Pages, o levanta un servidor local con " +
        "<code>python -m http.server 8000</code> y entra a <code>http://localhost:8000</code>."
      : "<strong>No se pudieron cargar los datos</strong>" +
        "Revisa que las hojas sigan publicadas en la web (Archivo → Compartir → Publicar en la web, formato CSV) " +
        "y que los gid de la configuración correspondan a las hojas correctas.<br><br>" +
        CONFIG.indicadores.map(i => {
          const d = ESTADO.datos[i.id];
          return "<strong>" + escapar(i.nombre) + ":</strong> " + escapar(d ? d.error : "sin respuesta");
        }).join("<br>");
    capa.innerHTML = '<div style="max-width:660px;padding:0 24px"><div class="bloque-error">' + diagnostico + "</div></div>";
    return;
  }

  construirMenu();
  construirContenedores();
  construirFiltros();
  renderizar();
  document.getElementById("btn-pdf").addEventListener("click", exportarPdf);
  capa.classList.add("oculta");

  /* Resumen técnico en consola: el saneamiento de datos no se expone en la interfaz. */
  if (DIAGNOSTICO.length){
    console.groupCollapsed("Bibliotecas Duoc UC · diagnóstico de datos (" + DIAGNOSTICO.length + " notas)");
    DIAGNOSTICO.forEach(l => console.log(l));
    console.groupEnd();
  }
}
document.addEventListener("DOMContentLoaded", iniciar);
