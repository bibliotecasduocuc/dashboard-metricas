/* ==================================================================================
   EXPORTACIÓN DE TABLAS

   Los botones se inyectan en una pasada posterior al renderizado, leyendo el DOM.
   Así no hay que tocar ninguna de las funciones de vista, y cualquier tabla nueva
   queda exportable sola.
   ================================================================================== */

/** Nombre de archivo base para la vista y el período actuales. */
function baseNombreArchivo(){
  const ind = indicadorDe(ESTADO.vistaActiva);
  const vista = ESTADO.vistaActiva === "resumen" ? "resumen" : (ind ? ind.archivoPdf : ESTADO.vistaActiva);
  const sinTilde = t => t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  const m = mesesSeleccionados();
  const periodo = (m.length === 1
    ? sinTilde(CONFIG.meses[m[0] - 1])
    : sinTilde(CONFIG.meses[m[0] - 1]) + "-a-" + sinTilde(CONFIG.meses[m[m.length - 1] - 1])
  ) + "-" + ESTADO.filtros.anio;
  return "bibliotecas-" + vista + "-" + periodo;
}

/** Etiqueta de una tabla: encabezado de su sección más el subtítulo interno si existe. */
function etiquetaDeTabla(env){
  const sec = env.closest(".seccion");
  const h2 = sec ? sec.querySelector("header h2") : null;
  const h3 = env.parentElement ? env.parentElement.querySelector("h3") : null;
  const partes = [];
  if (h2) partes.push(h2.textContent.trim());
  if (h3) partes.push(h3.textContent.replace(/·[\s\S]*$/, "").trim());
  return partes.join(" · ") || "Tabla";
}

/**
 * Convierte una <table> del dashboard en filas para la hoja de cálculo.
 * Devuelve además cuántas filas son de encabezado y cuántas de totales, para poder
 * darles un formato distinto.
 *
 * Los números salen como números, no como texto, para que Excel pueda sumarlos.
 * El «sin dato» se conserva como texto: es distinto de un cero y esa distinción es
 * justamente uno de los cuidados del dashboard.
 */
function tablaAMatriz(tabla){
  const leerSeccion = sel => {
    const filas = [];
    tabla.querySelectorAll(sel + " tr").forEach(tr => {
      const celdas = [];
      tr.querySelectorAll("th,td").forEach(c => {
        const colspan = +(c.getAttribute("colspan") || 1);
        const txt = c.textContent.replace(/[⇅▲▼]/g, "").replace(/\s+/g, " ").trim();
        celdas.push(valorDeCelda(c, txt));
        for (let i = 1; i < colspan; i++) celdas.push("");
      });
      if (celdas.length) filas.push(celdas);
    });
    return filas;
  };
  const enc = leerSeccion("thead");
  const cuerpo = leerSeccion("tbody");
  const pie = leerSeccion("tfoot");
  return { filas: enc.concat(cuerpo, pie), encabezados: enc.length, pies: pie.length };
}
function valorDeCelda(celda, txt){
  if (celda.tagName === "TH") return txt;
  if (celda.querySelector(".sin-dato") || /^sin dato$/i.test(txt)) return "sin dato";
  if (txt === "" || txt === "—" || txt === "n/a") return txt;
  const n = parsearNumero(txt);
  return n === null ? txt : n;
}

/** El ranking es un <ol>, pero para el usuario es una tabla: se exporta igual. */
function rankingAMatriz(ol){
  const filas = [["Acción formativa", "Sesiones", "Participaciones"]];
  ol.querySelectorAll("li").forEach(li => {
    const nom = li.querySelector(".nom");
    const sec = li.querySelector(".sec");
    const num = li.querySelector(".num");
    if (!nom || !num) return;
    const nombre = nom.textContent.replace(sec ? sec.textContent : "", "").trim();
    const sesiones = sec ? (parsearNumero((sec.textContent.match(/\d+/) || [""])[0]) || "") : "";
    filas.push([nombre, sesiones, parsearNumero(num.textContent)]);
  });
  return { filas, encabezados: 1, pies: 0 };
}

/** Nombre de hoja válido para Excel: 31 caracteres y sin caracteres reservados. */
function nombreHoja(texto, usados){
  let n = String(texto).replace(/[\[\]:*?\/\\]/g, " ").replace(/\s+/g, " ").trim().slice(0, 31) || "Hoja";
  if (usados.has(n)){
    let i = 2;
    while (usados.has((n.slice(0, 28) + " " + i))) i++;
    n = n.slice(0, 28) + " " + i;
  }
  usados.add(n);
  return n;
}

/** Todas las tablas exportables de la vista activa, en orden de aparición. */
function tablasDeLaVista(){
  const vista = document.querySelector(".vista.activa");
  if (!vista) return [];
  const salida = [];
  vista.querySelectorAll(".envoltorio-tabla, ol.ranking").forEach(el => {
    if (el.classList.contains("envoltorio-tabla")){
      const t = el.querySelector("table");
      if (t) salida.push({ el, etiqueta: etiquetaDeTabla(el), matriz: () => tablaAMatriz(t) });
    } else if (el.querySelector("li .num")){
      salida.push({ el, etiqueta: etiquetaDeTabla(el), matriz: () => rankingAMatriz(el) });
    }
  });
  return salida;
}

/* ----------------------------------------------------------------------------------
   EXCEL

   Se usa ExcelJS y no SheetJS porque la versión libre de SheetJS no escribe estilos:
   bordes y alineación son parte de su versión de pago. ExcelJS los soporta sin costo.

   La librería pesa cerca de 1 MB, así que se carga solo cuando alguien exporta. No
   tiene sentido que todos paguen ese tiempo de arranque por una función que se usa
   de vez en cuando.
   ---------------------------------------------------------------------------------- */
const URL_EXCELJS = "https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js";
let promesaExcelJS = null;

function cargarExcelJS(){
  if (typeof ExcelJS !== "undefined") return Promise.resolve(ExcelJS);
  if (promesaExcelJS) return promesaExcelJS;
  promesaExcelJS = new Promise((resolver, rechazar) => {
    const sc = document.createElement("script");
    sc.src = URL_EXCELJS;
    sc.onload = () => (typeof ExcelJS !== "undefined")
      ? resolver(ExcelJS) : rechazar(new Error("ExcelJS no quedó disponible"));
    sc.onerror = () => rechazar(new Error("No se pudo cargar ExcelJS desde el CDN"));
    document.head.appendChild(sc);
  });
  return promesaExcelJS;
}

/* Formato de las celdas.
   Alineación a la izquierda en todo, incluidos los números. Si en algún momento se
   prefiere el número alineado a la derecha —que facilita comparar magnitudes— basta
   cambiar `alineacionNumero` por "right". */
const EXCEL_FORMATO = {
  alineacionTexto: "left",
  alineacionNumero: "left",
  borde: { style: "thin", color: { argb: "FFD2D2D8" } },
  bordeEncabezado: { style: "thin", color: { argb: "FF3A3A42" } },
  fondoEncabezado: "FF0B0B0D",
  textoEncabezado: "FFFFFFFF",
  fondoPie: "FFF2F2F4",
  formatoNumero: "#,##0"
};

/** Arma una hoja con bordes en todas las celdas, alineación y encabezado fijo. */
function armarHoja(libro, nombre, datos){
  const hoja = libro.addWorksheet(nombre, {
    views: [{ state: "frozen", ySplit: datos.encabezados || 1 }]
  });
  const F = EXCEL_FORMATO;
  const anchos = [];

  datos.filas.forEach((fila, iFila) => {
    const esEncabezado = iFila < datos.encabezados;
    const esPie = datos.pies > 0 && iFila >= datos.filas.length - datos.pies;
    const filaHoja = hoja.addRow(fila);

    fila.forEach((valor, iCol) => {
      const celda = filaHoja.getCell(iCol + 1);
      const esNumero = typeof valor === "number";
      const b = esEncabezado ? F.bordeEncabezado : F.borde;

      celda.border = { top: b, left: b, bottom: b, right: b };
      celda.alignment = {
        horizontal: esNumero ? F.alineacionNumero : F.alineacionTexto,
        vertical: "middle", wrapText: false
      };
      if (esNumero) celda.numFmt = F.formatoNumero;

      if (esEncabezado){
        celda.font = { bold: true, color: { argb: F.textoEncabezado }, size: 10 };
        celda.fill = { type: "pattern", pattern: "solid", fgColor: { argb: F.fondoEncabezado } };
      } else if (esPie){
        celda.font = { bold: true, size: 10 };
        celda.fill = { type: "pattern", pattern: "solid", fgColor: { argb: F.fondoPie } };
      } else {
        celda.font = { size: 10 };
      }

      /* Ancho según el contenido más largo de la columna, con topes razonables. */
      const largo = String(valor === null || valor === undefined ? "" : valor).length;
      anchos[iCol] = Math.max(anchos[iCol] || 10, Math.min(largo + 3, 48));
    });
  });

  anchos.forEach((w, i) => { hoja.getColumn(i + 1).width = w; });
  return hoja;
}

/** Libro con una hoja por tabla. Solo datos: sin hoja de contexto. */
async function construirLibro(tablas){
  const XL = await cargarExcelJS();
  const libro = new XL.Workbook();
  libro.creator = CONFIG.institucion;
  libro.created = new Date();
  const usados = new Set();
  tablas.forEach(t => armarHoja(libro, nombreHoja(t.etiqueta, usados), t.matriz()));
  return libro;
}

/** Escribe el libro y dispara la descarga. */
async function descargarLibro(libro, nombreArchivo){
  const buffer = await libro.xlsx.writeBuffer();
  const blob = new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = nombreArchivo;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

/** Deja el botón en espera mientras se genera el archivo. */
async function conEspera(boton, tarea){
  const texto = boton ? boton.textContent : null;
  if (boton){ boton.disabled = true; boton.textContent = "Generando…"; }
  try {
    await tarea();
  } catch (e){
    anotar("Excel", "No se pudo generar el archivo: " + e.message);
    if (boton){ boton.disabled = false; boton.textContent = "Error"; setTimeout(() => { boton.textContent = texto; }, 2500); }
    return;
  }
  if (boton){ boton.disabled = false; boton.textContent = texto; }
}

/** Todas las tablas de la vista, cada una en su hoja. */
async function exportarExcelVista(boton){
  const tablas = tablasDeLaVista();
  if (!tablas.length) return;
  await conEspera(boton, async () => {
    const libro = await construirLibro(tablas);
    await descargarLibro(libro, baseNombreArchivo() + ".xlsx");
  });
}

/** Una sola tabla, en una sola hoja. */
async function exportarExcelTabla(t, boton){
  await conEspera(boton, async () => {
    const libro = await construirLibro([t]);
    await descargarLibro(libro, baseNombreArchivo() + "-" + slugDe(t.etiqueta) + ".xlsx");
  });
}

function slugDe(texto){
  return texto.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 50);
}

/**
 * PDF de una sola tabla. Se marca la ruta desde la sección hasta la tabla y la hoja
 * de impresión oculta todo lo que no esté en esa ruta, así el documento sale con el
 * encabezado institucional, los filtros aplicados y solo esa tabla.
 */
function exportarPdfTabla(t){
  prepararCabeceraImpresion();
  let n = t.el.parentElement;
  const marcados = [];
  while (n && n !== document.body){
    if (n.classList.contains("cuerpo-seccion") || n.classList.contains("seccion") ||
        n.classList.contains("vista") || n.tagName === "MAIN" || n.tagName === "DIV"){
      n.classList.add("ruta-impresion"); marcados.push(n);
    }
    n = n.parentElement;
  }
  t.el.classList.add("imprimir-esto");
  document.body.classList.add("imprimir-uno");

  const titulo = document.title;
  document.title = baseNombreArchivo() + "-" + slugDe(t.etiqueta);

  const limpiar = () => {
    document.body.classList.remove("imprimir-uno");
    t.el.classList.remove("imprimir-esto");
    marcados.forEach(x => x.classList.remove("ruta-impresion"));
    document.title = titulo;
  };
  window.addEventListener("afterprint", limpiar, { once: true });
  setTimeout(() => { window.print(); }, 120);
  setTimeout(limpiar, 4000);
}

/** Inyecta la barra de descarga sobre cada tabla de la vista activa. */
function agregarBotonesDeTabla(){
  tablasDeLaVista().forEach(t => {
    const previo = t.el.previousElementSibling;
    if (previo && previo.classList.contains("barra-tabla")) return;
    const barra = document.createElement("div");
    barra.className = "barra-tabla";
    barra.innerHTML = '<span class="etq">' + escapar(t.etiqueta) + "</span>";

    const bPdf = document.createElement("button");
    bPdf.type = "button"; bPdf.textContent = "PDF";
    bPdf.title = "Descargar esta tabla en PDF";
    bPdf.addEventListener("click", () => exportarPdfTabla(t));

    const bXls = document.createElement("button");
    bXls.type = "button"; bXls.textContent = "Excel";
    bXls.title = "Descargar esta tabla en Excel";
    bXls.addEventListener("click", () => exportarExcelTabla(t, bXls));

    barra.appendChild(bPdf); barra.appendChild(bXls);
    t.el.parentNode.insertBefore(barra, t.el);
  });
}

/* ==================================================================================
   EXPORTACIÓN A PDF
   window.print() con hoja @media print dedicada: las tablas salen como tablas reales
   (texto seleccionable, sin pixelado) y los canvas se imprimen a resolución nativa.
   ================================================================================== */
function nombreArchivoPdf(){
  const ind = indicadorDe(ESTADO.vistaActiva);
  const vista = ESTADO.vistaActiva === "resumen" ? "resumen" : (ind ? ind.archivoPdf : ESTADO.vistaActiva);
  /* Un mes: \u00abjunio-2026\u00bb. Un rango: \u00abenero-a-marzo-2026\u00bb. */
  const sinTilde = t => t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  const m = mesesSeleccionados();
  const periodo = (m.length === 1
    ? sinTilde(CONFIG.meses[m[0] - 1])
    : sinTilde(CONFIG.meses[m[0] - 1]) + "-a-" + sinTilde(CONFIG.meses[m[m.length - 1] - 1])
  ) + "-" + ESTADO.filtros.anio;
  return "bibliotecas-" + vista + "-" + periodo + ".pdf";
}

function prepararCabeceraImpresion(){
  const ind = indicadorDe(ESTADO.vistaActiva);
  document.getElementById("imp-vista").textContent =
    ESTADO.vistaActiva === "resumen" ? "Resumen de indicadores" : (ind ? ind.nombre : "");
  document.getElementById("imp-periodo").textContent =
    etiquetaSeleccion() + (esAcumulado() ? " (" + mesesSeleccionados().length + " meses acumulados)" : "");
  document.getElementById("imp-generado").textContent =
    new Date().toLocaleDateString("es-CL") + " a las " +
    new Date().toLocaleTimeString("es-CL", { hour: "2-digit", minute: "2-digit" });
  document.getElementById("imp-filtros").textContent = textoFiltros();
}

function exportarPdf(){
  prepararCabeceraImpresion();
  const titulo = document.title;
  document.title = nombreArchivoPdf().replace(/\.pdf$/, "");
  const restaurar = () => {
    document.title = titulo;
    Object.values(ESTADO.graficos).forEach(g => { try { g.resize(); } catch(e){} });
  };
  Object.values(ESTADO.graficos).forEach(g => { try { g.resize(); } catch(e){} });
  window.addEventListener("afterprint", restaurar, { once: true });
  setTimeout(() => { window.print(); }, 150);
  setTimeout(restaurar, 4000);
}

if (window.matchMedia){
  const mq = window.matchMedia("print");
  const h = () => Object.values(ESTADO.graficos).forEach(g => { try { g.resize(); } catch(e){} });
  if (mq.addEventListener) mq.addEventListener("change", h);
  else if (mq.addListener) mq.addListener(h);
}

/* ==================================================================================
   ARRANQUE
   ================================================================================== */
async function iniciar(){
  const capa = document.getElementById("capa-carga");
  const detalle = document.getElementById("detalle-carga");
  try {
    detalle.textContent = "Descargando y agregando las hojas del libro. La primera carga puede tardar unos segundos.";
    await cargarTodo();
  } catch (e){
    anotar("Sistema", "Error inesperado durante la carga: " + e.message);
  }

  const algunaOk = CONFIG.indicadores.some(i => ESTADO.datos[i.id] && ESTADO.datos[i.id].estado === "ok");
  if (!algunaOk){
    const diagnostico = esOrigenLocal()
      ? "<strong>El dashboard se abrió como archivo local (file://)</strong>" +
        "Por seguridad, el navegador no deja que una página abierta desde el disco descargue datos de Google. " +
        "Necesita servirse desde una dirección web: súbelo a GitHub Pages, o levanta un servidor local con " +
        "<code>python -m http.server 8000</code> y entra a <code>http://localhost:8000</code>."
      : "<strong>No se pudieron cargar los datos</strong>" +
        "Revisa que las hojas sigan publicadas en la web (Archivo → Compartir → Publicar en la web, formato CSV) " +
        "y que los gid de la configuración correspondan a las hojas correctas.<br><br>" +
        CONFIG.indicadores.map(i => {
          const d = ESTADO.datos[i.id];
          return "<strong>" + escapar(i.nombre) + ":</strong> " + escapar(d ? d.error : "sin respuesta");
        }).join("<br>");
    capa.innerHTML = '<div style="max-width:660px;padding:0 24px"><div class="bloque-error">' + diagnostico + "</div></div>";
    return;
  }

  construirMenu();
  construirContenedores();
  construirFiltros();
  renderizar();
  document.getElementById("btn-pdf").addEventListener("click", exportarPdf);

  const btnExcel = document.getElementById("btn-excel");
  btnExcel.addEventListener("click", () => exportarExcelVista(btnExcel));
  capa.classList.add("oculta");

  /* Resumen técnico en consola: el saneamiento de datos no se expone en la interfaz. */
  if (DIAGNOSTICO.length){
    console.groupCollapsed("Bibliotecas Duoc UC · diagnóstico de datos (" + DIAGNOSTICO.length + " notas)");
    DIAGNOSTICO.forEach(l => console.log(l));
    console.groupEnd();
  }
}
document.addEventListener("DOMContentLoaded", iniciar);
</script>
