function seccion(id, titulo, controles, cuerpo){
  return '<section class="seccion" data-seccion="' + id + '">' +
    "<header><h2>" + escapar(titulo) + "</h2>" + (controles || "") + "</header>" +
    '<div class="cuerpo-seccion">' + cuerpo + "</div></section>";
}

/** Tarjeta KPI del Resumen. */
function htmlKpiResumen(ind, ref, prev, mes, hayPrev){
  const d = ESTADO.datos[ind.id];
  if (!d || d.estado !== "ok"){
    return '<div class="kpi error"><div class="titulo">' + escapar(ind.nombre) + "</div>" +
      '<div class="msj-error">No se pudo cargar esta hoja.</div>' +
      '<div class="pie">Revisa el detalle en la vista del indicador.</div></div>';
  }

  const met = ind.metricas[0];
  const actual = valor(ind.id, met.id, { anio: ref, mes });
  const anterior = hayPrev ? valor(ind.id, met.id, { anio: prev, mes }) : null;
  const v = hayPrev ? variacion(actual, anterior) : null;

  let secundaria = "";
  if (ind.metricas.length > 1){
    const m2 = ind.metricas[1];
    const val2 = valor(ind.id, m2.id, { anio: ref, mes });
    secundaria = '<div class="secundario">' + escapar(m2.etiqueta) + ": <b>" + fmt(val2) + "</b></div>";
  }

  const pie = hayPrev
    ? htmlVariacion(v) + '<span>vs. ' + nombreMes(mes) + " " + prev + ": " + fmtTxt(anterior) + "</span>"
    : '<span style="color:var(--texto-muy-tenue)">Sin año anterior en los datos para comparar</span>';

  return '<div class="kpi">' +
    '<div class="titulo">' + escapar(ind.nombre) + "</div>" +
    '<div class="valor">' + fmt(actual) + '<span class="unidad">' +
      escapar(ind.metricas.length > 1 ? met.etiqueta.toLowerCase() : ind.unidad) + "</span></div>" +
    secundaria +
    '<div class="pie">' + pie + "</div></div>";
}

/* ---------------------------------------------------------------------------------
   TABLA COMPARATIVA DEL RESUMEN (19 sedes × 4 indicadores)
   --------------------------------------------------------------------------------- */
function renderTablaResumen(){
  const cont = document.getElementById("cont-tabla-resumen");
  const { ref, prev, hayPrev } = aniosDeTrabajo();
  const mes = ESTADO.filtros.mes;
  const sedes = sedesVisibles();

  if (sedes.length === 0){ cont.innerHTML = '<div class="vacio">No hay sedes seleccionadas.</div>'; return; }

  // Se arma primero el modelo de datos para poder ordenar sin volver a consultar.
  const filas = sedes.map(sede => {
    const celdas = CONFIG.indicadores.map(ind => {
      const met = ind.metricas[0];
      const a = valor(ind.id, met.id, { anio: ref, mes, sede });
      const b = hayPrev ? valor(ind.id, met.id, { anio: prev, mes, sede }) : null;
      return { actual: a, anterior: b, variacion: hayPrev ? variacion(a, b) : null };
    });
    return { sede, celdas };
  });

  const cols = [{ etiqueta: "Sede", tipo: "texto" }];
  CONFIG.indicadores.forEach(ind => {
    cols.push({ etiqueta: ind.nombreCorto, tipo: "num" });
    if (hayPrev) cols.push({ etiqueta: "Var.", tipo: "num", tenue: true });
  });

  ordenarFilas("resumen", filas, cols, hayPrev);

  let html = '<table class="datos"><thead><tr>';
  html += th("Sede", 0, "resumen", "izq");
  let ci = 1;
  CONFIG.indicadores.forEach(ind => {
    html += th(ind.nombreCorto, ci++, "resumen", "sep-izq");
    if (hayPrev) html += th("Var. %", ci++, "resumen", "");
  });
  html += "</tr></thead><tbody>";

  filas.forEach(f => {
    html += '<tr><td class="izq">' + escapar(f.sede) + "</td>";
    f.celdas.forEach(c => {
      html += '<td class="sep-izq">' + fmt(c.actual) + "</td>";
      if (hayPrev) html += "<td>" + htmlVariacion(c.variacion, false) + "</td>";
    });
    html += "</tr>";
  });
  html += "</tbody><tfoot><tr><td class='izq'>Total sistema</td>";
  CONFIG.indicadores.forEach((ind, i) => {
    const totalA = sumar(filas.map(f => f.celdas[i].actual));
    const totalB = hayPrev ? sumar(filas.map(f => f.celdas[i].anterior)) : null;
    html += '<td class="sep-izq">' + fmt(totalA) + "</td>";
    if (hayPrev) html += "<td>" + htmlVariacion(variacion(totalA, totalB), false) + "</td>";
  });
  html += "</tr></tfoot></table>";

  cont.innerHTML = html;
  activarOrdenamiento(cont, "resumen", renderTablaResumen);
}

/* ---------------------------------------------------------------------------------
   VISTAS POR INDICADOR
   --------------------------------------------------------------------------------- */
function renderIndicador(ind){
  const cont = document.getElementById("vista-" + ind.id);
  const d = ESTADO.datos[ind.id];
  const { ref, prev, hayPrev } = aniosDeTrabajo();
  const mes = ESTADO.filtros.mes;

  const cabecera =
    '<div class="encabezado-vista">' +
      '<h1><span class="sub">' + escapar(CONFIG.institucion) + "</span>" + escapar(ind.nombre) +
      '<span class="periodo">' + nombreMes(mes) + " " + ref + "</span></h1>" +
    "</div>";

  /* Si la hoja falló, esta vista muestra su propio error sin afectar al resto. */
  if (!d || d.estado !== "ok"){
    cont.innerHTML = cabecera +
      '<div class="bloque-error"><strong>No se pudieron cargar los datos de ' + escapar(ind.nombre) + "</strong>" +
      escapar(d ? d.error : "Error desconocido") +
      '<br><br>Hoja de origen: <code>' + escapar(/^PEGAR_GID/.test(fuenteDe(ind).gid) ? "(gid sin configurar)" : urlHoja(fuenteDe(ind).gid)) + "</code>" +
      "<br>El resto del dashboard sigue funcionando con las hojas que sí cargaron.</div>";
    return;
  }

  /* KPIs: mes de reporte y acumulado del año a la fecha, por cada métrica. */
  const tarjetas = [];
  ind.metricas.forEach(met => {
    const actual = valor(ind.id, met.id, { anio: ref, mes });
    const ant = hayPrev ? valor(ind.id, met.id, { anio: prev, mes }) : null;
    tarjetas.push(tarjeta(
      met.etiqueta + " · " + nombreMes(mes),
      actual, hayPrev ? variacion(actual, ant) : null,
      hayPrev ? "vs. " + nombreMes(mes) + " " + prev + ": " + fmtTxt(ant) : null
    ));

    const acum = valor(ind.id, met.id, { anio: ref, hastaMes: mes });
    const acumAnt = hayPrev ? valor(ind.id, met.id, { anio: prev, hastaMes: mes }) : null;
    tarjetas.push(tarjeta(
      met.etiqueta + " · acumulado ene–" + CONFIG.mesesCortos[mes - 1].toLowerCase() + " " + ref,
      acum, hayPrev ? variacion(acum, acumAnt) : null,
      hayPrev ? "vs. acumulado " + prev + ": " + fmtTxt(acumAnt) : null
    ));
  });

  /* Promedio por actividad, útil solo en Acciones Formativas. */
  if (ind.id === "acciones_formativas"){
    const act = valor(ind.id, "actividades", { anio: ref, mes });
    const asi = valor(ind.id, "asistentes", { anio: ref, mes });
    const prom = (act && asi !== null && act > 0) ? asi / act : null;
    tarjetas.push('<div class="kpi"><div class="titulo">Promedio de asistentes por actividad</div>' +
      '<div class="valor">' + (prom === null ? '<span class="sin-dato">sin dato</span>' : FMT_DECIMAL.format(prom)) + "</div>" +
      '<div class="pie"><span>' + nombreMes(mes) + " " + ref + "</span></div></div>");
  }

  cont.innerHTML = cabecera + htmlAviso() +
    '<div class="grilla-kpi">' + tarjetas.join("") + "</div>" +

    seccion("evo-" + ind.id, "Evolución mensual",
      ind.metricas.length > 1 ? selectorMetrica("sel-met-" + ind.id, ind) : "",
      '<div class="caja-grafico"><canvas id="g-evo-' + ind.id + '"></canvas></div>') +

    seccion("barras-" + ind.id, "Comparativo por sede · " + nombreMes(mes) + " " + ref, "",
      '<div class="caja-grafico alta"><canvas id="g-barras-' + ind.id + '"></canvas></div>') +

    seccion("tabla-" + ind.id, "Detalle por sede", "",
      '<div class="envoltorio-tabla" id="cont-tabla-' + ind.id + '"></div>' +
      (ind.nota ? '<p class="nota"><strong>Nota metodológica:</strong> ' + escapar(ind.nota) + "</p>" : "") +
      '<p class="nota">Acumulado = suma de enero a ' + nombreMes(mes).toLowerCase() + ". Las variaciones muestran «n/a» cuando el período de comparación no tiene dato o es cero.</p>");

  const selMet = document.getElementById("sel-met-" + ind.id);
  const metActual = () => (selMet ? selMet.value : ind.metricas[0].id);
  if (selMet) selMet.addEventListener("change", () => {
    dibujarEvolucion("g-evo-" + ind.id, ind.id + "|" + metActual());
    dibujarBarrasSede("g-barras-" + ind.id, ind, metActual());
  });

  dibujarEvolucion("g-evo-" + ind.id, ind.id + "|" + metActual());
  dibujarBarrasSede("g-barras-" + ind.id, ind, metActual());
  renderTablaIndicador(ind);
}

function selectorMetrica(id, ind){
  return '<div class="espaciador"></div><select id="' + id + '" aria-label="Métrica">' +
    ind.metricas.map(m => '<option value="' + m.id + '">' + escapar(m.etiqueta) + "</option>").join("") + "</select>";
}

function tarjeta(titulo, val, vari, refTexto){
  const pie = refTexto
    ? htmlVariacion(vari) + "<span>" + escapar(refTexto) + "</span>"
    : '<span style="color:var(--texto-muy-tenue)">Sin período de comparación disponible</span>';
  return '<div class="kpi"><div class="titulo">' + escapar(titulo) + "</div>" +
    '<div class="valor">' + fmt(val) + "</div>" +
    '<div class="pie">' + pie + "</div></div>";
}

/** Tabla detallada de una vista de indicador. */
function renderTablaIndicador(ind){
  const cont = document.getElementById("cont-tabla-" + ind.id);
  const { ref, prev, hayPrev } = aniosDeTrabajo();
  const mes = ESTADO.filtros.mes;
  const sedes = sedesVisibles();
  const met = ind.metricas[0];
  const selMet = document.getElementById("sel-met-" + ind.id);
  const idMet = selMet ? selMet.value : met.id;
  const metObj = ind.metricas.find(m => m.id === idMet) || met;

  if (sedes.length === 0){ cont.innerHTML = '<div class="vacio">No hay sedes seleccionadas.</div>'; return; }

  const filas = sedes.map(sede => {
    const a  = valor(ind.id, idMet, { anio: ref,  mes, sede });
    const b  = hayPrev ? valor(ind.id, idMet, { anio: prev, mes, sede }) : null;
    const aa = valor(ind.id, idMet, { anio: ref,  hastaMes: mes, sede });
    const bb = hayPrev ? valor(ind.id, idMet, { anio: prev, hastaMes: mes, sede }) : null;
    return {
      sede, celdas: [a, b, hayPrev ? variacion(a, b) : null, aa, bb, hayPrev ? variacion(aa, bb) : null],
      valores: { a, b, aa, bb }
    };
  });

  const cols = hayPrev
    ? [{ tipo: "texto" }, { tipo: "num" }, { tipo: "num" }, { tipo: "num" }, { tipo: "num" }, { tipo: "num" }, { tipo: "num" }]
    : [{ tipo: "texto" }, { tipo: "num" }, { tipo: "num" }];

  ordenarFilasIndicador(ind.id, filas, hayPrev);

  const claveTabla = ind.id;
  let html = '<table class="datos">';

  if (hayPrev){
    html += '<thead><tr class="grupo"><th></th><th colspan="3" class="sep-izq">' + nombreMes(mes) + '</th><th colspan="3" class="sep-izq">Acumulado enero–' + nombreMes(mes).toLowerCase() + "</th></tr><tr>";
    html += th("Sede", 0, claveTabla, "izq");
    html += th(String(ref), 1, claveTabla, "sep-izq");
    html += th(String(prev), 2, claveTabla, "");
    html += th("Var. %", 3, claveTabla, "");
    html += th(String(ref), 4, claveTabla, "sep-izq");
    html += th(String(prev), 5, claveTabla, "");
    html += th("Var. %", 6, claveTabla, "");
    html += "</tr></thead><tbody>";
    filas.forEach(f => {
      html += '<tr><td class="izq">' + escapar(f.sede) + "</td>" +
        '<td class="sep-izq">' + fmt(f.celdas[0]) + "</td>" +
        "<td>" + fmt(f.celdas[1]) + "</td>" +
        "<td>" + htmlVariacion(f.celdas[2], false) + "</td>" +
        '<td class="sep-izq">' + fmt(f.celdas[3]) + "</td>" +
        "<td>" + fmt(f.celdas[4]) + "</td>" +
        "<td>" + htmlVariacion(f.celdas[5], false) + "</td></tr>";
    });
    const tA = sumar(filas.map(f => f.valores.a)),  tB = sumar(filas.map(f => f.valores.b));
    const tAA = sumar(filas.map(f => f.valores.aa)), tBB = sumar(filas.map(f => f.valores.bb));
    html += "</tbody><tfoot><tr><td class='izq'>Total sistema</td>" +
      '<td class="sep-izq">' + fmt(tA) + "</td><td>" + fmt(tB) + "</td><td>" + htmlVariacion(variacion(tA, tB), false) + "</td>" +
      '<td class="sep-izq">' + fmt(tAA) + "</td><td>" + fmt(tBB) + "</td><td>" + htmlVariacion(variacion(tAA, tBB), false) + "</td></tr></tfoot>";
  } else {
    /* Sin año anterior en los datos: se omiten las columnas de comparación
       en vez de llenarlas de «n/a». Vuelven solas al cargar el histórico. */
    html += "<thead><tr>";
    html += th("Sede", 0, claveTabla, "izq");
    html += th(nombreMes(mes) + " " + ref, 1, claveTabla, "sep-izq");
    html += th("Acumulado enero–" + nombreMes(mes).toLowerCase() + " " + ref, 2, claveTabla, "");
    html += "</tr></thead><tbody>";
    filas.forEach(f => {
      html += '<tr><td class="izq">' + escapar(f.sede) + "</td>" +
        '<td class="sep-izq">' + fmt(f.celdas[0]) + "</td>" +
        "<td>" + fmt(f.celdas[3]) + "</td></tr>";
    });
    const tA = sumar(filas.map(f => f.valores.a)), tAA = sumar(filas.map(f => f.valores.aa));
    html += "</tbody><tfoot><tr><td class='izq'>Total sistema</td>" +
      '<td class="sep-izq">' + fmt(tA) + "</td><td>" + fmt(tAA) + "</td></tr></tfoot>";
  }

  html += "</table>";
  cont.innerHTML = html;
  activarOrdenamiento(cont, claveTabla, () => renderTablaIndicador(ind));

}

/* ---------------------------------------------------------------------------------
   ORDENAMIENTO DE TABLAS
   --------------------------------------------------------------------------------- */
function th(etiqueta, indice, clave, clases){
  const o = ESTADO.orden[clave];
  let cls = "ordenable " + (clases || "");
  if (o && o.col === indice) cls += o.dir === 1 ? " ord-asc" : " ord-desc";
  const ind = (o && o.col === indice) ? (o.dir === 1 ? "▲" : "▼") : "⇅";
  return '<th class="' + cls.trim() + '" data-col="' + indice + '">' + escapar(etiqueta) + '<span class="ind">' + ind + "</span></th>";
}

function activarOrdenamiento(cont, clave, redibujar){
  cont.querySelectorAll("th.ordenable").forEach(el => {
    el.addEventListener("click", () => {
      const col = +el.dataset.col;
      const o = ESTADO.orden[clave];
      // Primer clic en una columna numérica: descendente (lo más alto arriba).
      ESTADO.orden[clave] = (o && o.col === col) ? { col, dir: -o.dir } : { col, dir: col === 0 ? 1 : -1 };
      redibujar();
    });
  });
}

/** null siempre al final, sin importar la dirección del orden. */
function comparar(a, b, dir){
  const na = (a === null || a === undefined || !Number.isFinite(a));
  const nb = (b === null || b === undefined || !Number.isFinite(b));
  if (na && nb) return 0;
  if (na) return 1;
  if (nb) return -1;
  return (a - b) * dir;
}

function ordenarFilas(clave, filas, cols, hayPrev){
  const o = ESTADO.orden[clave];
  if (!o) return;
  if (o.col === 0){
    filas.sort((x, y) => x.sede.localeCompare(y.sede, "es") * o.dir);
    return;
  }
  const porInd = hayPrev ? 2 : 1;
  const idxInd = Math.floor((o.col - 1) / porInd);
  const esVar = hayPrev && ((o.col - 1) % porInd === 1);
  filas.sort((x, y) => {
    const a = esVar ? x.celdas[idxInd].variacion : x.celdas[idxInd].actual;
    const b = esVar ? y.celdas[idxInd].variacion : y.celdas[idxInd].actual;
    return comparar(a, b, o.dir);
  });
}

function ordenarFilasIndicador(clave, filas, hayPrev){
  const o = ESTADO.orden[clave];
  if (!o) return;
  if (o.col === 0){ filas.sort((x, y) => x.sede.localeCompare(y.sede, "es") * o.dir); return; }
  const mapa = hayPrev ? [null, 0, 1, 2, 3, 4, 5] : [null, 0, 3];
  const idx = mapa[o.col];
  if (idx === undefined || idx === null) return;
  filas.sort((x, y) => comparar(x.celdas[idx], y.celdas[idx], o.dir));
}

/* ==================================================================================
   12. GRÁFICOS (Chart.js)
   ================================================================================== */
Chart.defaults.font.family = "'Lato', sans-serif";
Chart.defaults.font.size = 11;
Chart.defaults.color = "#606060";
Chart.defaults.animation = false;   // más previsible al imprimir

function destruir(id){
  if (ESTADO.graficos[id]){ ESTADO.graficos[id].destroy(); delete ESTADO.graficos[id]; }
}

/** Gráfico de líneas: evolución mensual año actual vs. año anterior. */
function dibujarEvolucion(idCanvas, valorSelector){
  const [idInd, idMet] = valorSelector.split("|");
  const ind = CONFIG.indicadores.find(i => i.id === idInd);
  const canvas = document.getElementById(idCanvas);
  if (!canvas || !ind) return;
  destruir(idCanvas);

  const d = ESTADO.datos[idInd];
  const cont = canvas.parentElement;
  if (!d || d.estado !== "ok"){
    cont.innerHTML = '<div class="bloque-error"><strong>Sin datos para graficar</strong>' + escapar(d ? d.error : "") + "</div>";
    return;
  }

  const { ref, prev, hayPrev } = aniosDeTrabajo();
  const serieRef = serieMensual(idInd, idMet, ref);
  const seriePrev = hayPrev ? serieMensual(idInd, idMet, prev) : null;

  const datasets = [];
  if (seriePrev){
    datasets.push({
      label: String(prev), data: seriePrev,
      borderColor: CONFIG.colores.grisSerie, backgroundColor: CONFIG.colores.grisSerie,
      borderWidth: 2, borderDash: [5, 4], pointRadius: 2.5, pointHoverRadius: 5, tension: .18, spanGaps: false
    });
  }
  datasets.push({
    label: String(ref), data: serieRef,
    borderColor: CONFIG.colores.negro, backgroundColor: CONFIG.colores.negro,
    borderWidth: 2.5, pointRadius: 3, pointHoverRadius: 6,
    pointBackgroundColor: CONFIG.colores.amarillo, pointBorderColor: CONFIG.colores.negro, pointBorderWidth: 1.5,
    tension: .18, spanGaps: false
  });

  ESTADO.graficos[idCanvas] = new Chart(canvas, {
    type: "line",
    data: { labels: CONFIG.mesesCortos, datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: { position: "top", align: "end", labels: { boxWidth: 14, boxHeight: 2, usePointStyle: false, padding: 14 } },
        tooltip: {
          backgroundColor: "#000", titleFont: { weight: "900" }, padding: 10, cornerRadius: 2, displayColors: true,
          callbacks: {
            title: items => nombreMes(items[0].dataIndex + 1),
            label: item => {
              const v = item.parsed.y;
              return item.dataset.label + ": " + (v === null ? "sin dato" : FMT_ENTERO.format(v));
            },
            afterBody: items => {
              if (!seriePrev) return "";
              const i = items[0].dataIndex;
              const vr = variacion(serieRef[i], seriePrev[i]);
              return vr === null
                ? "Variación interanual: n/a"
                : "Variación interanual: " + (vr > 0 ? "+" : "") + FMT_DECIMAL.format(vr) + "%";
            }
          }
        }
      },
      scales: {
        x: { grid: { display: false }, border: { color: "#C9C9C9" } },
        y: { beginAtZero: true, grid: { color: "#EFEFEF" }, border: { display: false },
             ticks: { callback: v => FMT_ENTERO.format(v) } }
      }
    }
  });
}

/** Barras horizontales: ranking de sedes según el indicador seleccionado. */
function dibujarRanking(idCanvas, valorSelector){
  const [idInd, idMet] = valorSelector.split("|");
  const ind = CONFIG.indicadores.find(i => i.id === idInd);
  if (ind) dibujarBarrasSede(idCanvas, ind, idMet, true);
}

/** Barras horizontales por sede. `ordenar` = ranking descendente. */
function dibujarBarrasSede(idCanvas, ind, idMet, ordenar){
  const canvas = document.getElementById(idCanvas);
  if (!canvas) return;
  destruir(idCanvas);

  const d = ESTADO.datos[ind.id];
  const cont = canvas.parentElement;
  if (!d || d.estado !== "ok"){
    cont.innerHTML = '<div class="bloque-error"><strong>Sin datos para graficar</strong>' + escapar(d ? d.error : "") + "</div>";
    return;
  }

  const { ref, prev, hayPrev } = aniosDeTrabajo();
  const mes = ESTADO.filtros.mes;

  let filas = sedesVisibles().map(sede => ({
    sede,
    actual: valor(ind.id, idMet, { anio: ref, mes, sede }),
    anterior: hayPrev ? valor(ind.id, idMet, { anio: prev, mes, sede }) : null
  }));

  if (ordenar !== false) filas.sort((a, b) => comparar(a.actual, b.actual, -1));

  if (filas.length === 0){ cont.innerHTML = '<div class="vacio">No hay sedes seleccionadas.</div>'; return; }

  const datasets = [];
  if (hayPrev){
    datasets.push({
      label: String(prev), data: filas.map(f => f.anterior),
      backgroundColor: CONFIG.colores.grisSerie, borderWidth: 0, barPercentage: .82, categoryPercentage: .72
    });
  }
  datasets.push({
    label: String(ref), data: filas.map(f => f.actual),
    backgroundColor: CONFIG.colores.amarillo,     // serie del año actual en amarillo Duoc
    borderColor: CONFIG.colores.negro, borderWidth: 1,
    barPercentage: .82, categoryPercentage: .72
  });

  ESTADO.graficos[idCanvas] = new Chart(canvas, {
    type: "bar",
    data: { labels: filas.map(f => f.sede), datasets },
    options: {
      indexAxis: "y",
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: hayPrev, position: "top", align: "end", labels: { boxWidth: 12, boxHeight: 12, padding: 12 } },
        tooltip: {
          backgroundColor: "#000", titleFont: { weight: "900" }, padding: 10, cornerRadius: 2,
          callbacks: {
            label: item => {
              const v = item.parsed.x;
              return item.dataset.label + ": " + (v === null ? "sin dato" : FMT_ENTERO.format(v));
            },
            afterBody: items => {
              if (!hayPrev) return "";
              const f = filas[items[0].dataIndex];
              const vr = variacion(f.actual, f.anterior);
              return vr === null
                ? "Variación interanual: n/a"
                : "Variación interanual: " + (vr > 0 ? "+" : "") + FMT_DECIMAL.format(vr) + "%";
            }
          }
        }
      },
      scales: {
        x: { beginAtZero: true, grid: { color: "#EFEFEF" }, border: { display: false },
             ticks: { callback: v => FMT_ENTERO.format(v) } },
        y: { grid: { display: false }, border: { color: "#C9C9C9" },
             ticks: { autoSkip: false, font: { size: 10.5 } } }
      }
    }
  });
}
</script>

<script>
"use strict";
/* ==================================================================================
   13. EXPORTACIÓN A PDF
   Se usa window.print() con una hoja @media print dedicada, en vez de
   html2canvas + jsPDF. Motivos:
     · Las tablas salen como tablas reales (texto seleccionable y buscable, sin
       pixelado), que es justamente el requisito. html2canvas rasteriza todo.
     · Los <canvas> de Chart.js se imprimen nativamente a la resolución del
       dispositivo, sin el reescalado borroso típico de html2canvas.
     · Los acentos y la tipografía Lato se conservan; html2canvas depende de que
       las fuentes web ya estén resueltas y suele romper tildes en algunos casos.
     · Cero dependencias extra y ningún problema de CORS al capturar.
   Lo único que window.print() no permite controlar es el nombre del archivo; se
   resuelve cambiando temporalmente document.title, que es lo que Chrome, Edge y
   Firefox usan como nombre por defecto al «Guardar como PDF».
   ================================================================================== */

function nombreArchivoPdf(){
  const vista = ESTADO.vistaActiva === "resumen"
    ? "resumen"
    : (CONFIG.indicadores.find(i => i.id === ESTADO.vistaActiva) || {}).id;
  const mes = CONFIG.meses[ESTADO.filtros.mes - 1].toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  return "bibliotecas-" + vista + "-" + mes + "-" + ESTADO.filtros.anio + ".pdf";
}

function exportarPdf(){
  /* Se completa el encabezado que solo existe en el PDF, con lo que hay en pantalla. */
  const v = ESTADO.vistaActiva === "resumen"
    ? "Resumen de indicadores"
    : (CONFIG.indicadores.find(i => i.id === ESTADO.vistaActiva) || {}).nombre;

  document.getElementById("imp-vista").textContent = v;
  document.getElementById("imp-periodo").textContent = nombreMes(ESTADO.filtros.mes) + " " + ESTADO.filtros.anio;
  document.getElementById("imp-generado").textContent =
    new Date().toLocaleDateString("es-CL") + " a las " +
    new Date().toLocaleTimeString("es-CL", { hour: "2-digit", minute: "2-digit" });
  document.getElementById("imp-filtros").textContent = textoFiltros();

  /* Los gráficos deben redimensionarse al ancho de página antes de imprimir. */
  const titulo = document.title;
  document.title = nombreArchivoPdf().replace(/\.pdf$/, "");

  const restaurar = () => {
    document.title = titulo;
    Object.values(ESTADO.graficos).forEach(g => { try { g.resize(); } catch(e){} });
  };

  // Chart.js necesita un tick para reajustarse al layout de impresión.
  Object.values(ESTADO.graficos).forEach(g => { try { g.resize(); } catch(e){} });

  window.addEventListener("afterprint", restaurar, { once: true });
  setTimeout(() => { window.print(); }, 120);
  // Respaldo por si el navegador no dispara afterprint.
  setTimeout(restaurar, 4000);
}

/* Chart.js se reajusta cuando el navegador entra en modo impresión. */
if (window.matchMedia){
  const mq = window.matchMedia("print");
  const handler = () => Object.values(ESTADO.graficos).forEach(g => { try { g.resize(); } catch(e){} });
  if (mq.addEventListener) mq.addEventListener("change", handler);
  else if (mq.addListener) mq.addListener(handler);
}

/* ==================================================================================
   14. ARRANQUE
   ================================================================================== */
async function iniciar(){
  const capa = document.getElementById("capa-carga");
  const detalle = document.getElementById("detalle-carga");

  try {
    detalle.textContent = CONFIG.modo === "crudo"
      ? "Descargando y agregando las hojas del libro. La primera carga puede tardar unos segundos."
      : "Descargando las pestañas resumen…";
    await cargarTodo();
  } catch (e){
    // cargarTodo() ya captura los fallos por hoja; esto cubre un error inesperado.
    registrarAdvertencia("Sistema", "Error inesperado durante la carga: " + e.message);
  }

  const algunaOk = CONFIG.indicadores.some(i => ESTADO.datos[i.id] && ESTADO.datos[i.id].estado === "ok");

  if (!algunaOk){
    /* Caso más frecuente: el archivo se abrió con doble clic. No es un problema
       de las hojas, así que se da la instrucción concreta para resolverlo. */
    const diagnostico = esOrigenLocal()
      ? "<strong>El dashboard se abrió como archivo local (file://)</strong>" +
        "Por seguridad, el navegador no deja que una página abierta desde el disco descargue datos de Google. " +
        "Las hojas están bien: solo falta servir el archivo desde una dirección web.<br><br>" +
        "<strong>Opción 1 — publicarlo (lo definitivo):</strong> súbelo a GitHub Pages. " +
        "Ahí queda en <code>https://…</code> y funciona sin más ajustes.<br><br>" +
        "<strong>Opción 2 — probarlo ahora en tu equipo:</strong> abre una consola en la carpeta " +
        "donde está este archivo y ejecuta <code>python -m http.server 8000</code>, " +
        "luego entra a <code>http://localhost:8000</code>.<br><br>" +
        "<em>Para confirmar que las hojas están bien: pega la URL de cualquiera de los cuatro CSV " +
        "en una pestaña nueva. Si descarga el archivo, la publicación está correcta.</em>"
      : "<strong>No se pudo cargar ninguna hoja de datos</strong>" +
        "Revisa que las cuatro hojas sigan publicadas en la web (Archivo → Compartir → Publicar en la web, formato CSV) " +
        "y que los gid de la configuración correspondan a las hojas correctas.<br><br>" +
        CONFIG.indicadores.map(i => {
          const d = ESTADO.datos[i.id];
          return "<strong>" + escapar(i.nombre) + ":</strong> " + escapar(d ? d.error : "sin respuesta");
        }).join("<br>");

    capa.innerHTML = '<div style="max-width:660px;padding:0 24px">' +
      '<div class="bloque-error">' + diagnostico + "</div></div>";
    return;
  }

  construirMenu();
  construirContenedores();
  construirFiltros();
  renderizarAdvertencias();
  renderizar();

  document.getElementById("btn-pdf").addEventListener("click", exportarPdf);

  capa.classList.add("oculta");
}

document.addEventListener("DOMContentLoaded", iniciar);
</script>
