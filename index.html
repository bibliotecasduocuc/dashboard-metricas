<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Indicadores de gestión · Bibliotecas Duoc UC</title>

<!-- Tipografía institucional: Lato (Regular 400, Bold 700, Black 900) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">

<!-- Librerías desde CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

<style>
/* ============================================================
   TEMA DUOC SIGNATURE
   Conserva la identidad institucional (blanco, negro, #F5A800,
   Lato) y trabaja profundidad, jerarquía y movimiento.
   ============================================================ */
:root{
  /* --- Identidad, sin cambios --- */
  --negro:#000000;
  --blanco:#FFFFFF;
  --amarillo:#F5A800;

  /* --- Paleta ampliada, derivada de la institucional --- */
  --tinta:#0B0B0D;
  --tinta-2:#17171B;
  --lienzo:#F7F7F9;
  --superficie:#FFFFFF;
  --velo:#FBFBFC;
  --superficie-alt:#FAFAFB;
  --linea:#E8E8EC;
  --borde:#E8E8EC;
  --borde-fuerte:#D2D2D8;
  --ambar-alto:#FFC24D;
  --ambar-bajo:#D99400;
  --amarillo-suave:#FFF6E3;
  --ambar-humo:rgba(245,168,0,.10);

  --texto:#0B0B0D;
  --texto-tenue:#5B5B66;
  --texto-muy-tenue:#8E8E9A;
  --serie-anterior:#B5B5B5;
  --serie-actual:#000000;
  --negativo:#C0271E;
  --alerta:#8A6100;

  /* --- Degradados: deben leerse como luz, no como color --- */
  --grad-superficie:linear-gradient(180deg,#FFFFFF 0%,#FBFBFC 100%);
  --grad-tinta:linear-gradient(180deg,#17171B 0%,#0B0B0D 100%);
  --grad-ambar:linear-gradient(180deg,#FFC24D 0%,#F5A800 55%,#D99400 100%);

  /* --- Elevación --- */
  --sombra-1:0 1px 2px rgba(11,11,13,.05);
  --sombra-2:0 1px 2px rgba(11,11,13,.04),0 12px 28px -14px rgba(11,11,13,.16);
  --sombra-3:0 2px 4px rgba(11,11,13,.06),0 20px 40px -16px rgba(11,11,13,.22);

  --radio:12px;
  --radio-sm:8px;
  --radio-xs:6px;

  --curva:cubic-bezier(.4,0,.2,1);
  --rapido:140ms;
  --normal:220ms;

  --alto-banner:60px;
  --alto-nav:50px;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Lato',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-weight:400;background:var(--lienzo);color:var(--texto);
  font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
}
h1,h2,h3,h4{margin:0;font-weight:900;letter-spacing:-0.018em;}
button{font-family:inherit;font-size:inherit;cursor:pointer;}
table{border-collapse:collapse;width:100%;}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important;}
}

/* ============================================================
   ENCABEZADO
   ============================================================ */
#cabecera{
  position:sticky;top:0;z-index:200;
  background:var(--grad-tinta);
  box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 8px 24px -12px rgba(11,11,13,.5);
}
#banner{
  height:var(--alto-banner);display:flex;align-items:center;gap:16px;
  padding:0 28px;color:var(--blanco);
  border-bottom:1px solid rgba(255,255,255,.07);
}
#banner .marca{display:flex;align-items:baseline;gap:12px;min-width:0;}
#banner .marca strong{font-weight:900;font-size:18px;letter-spacing:-0.028em;white-space:nowrap;}
#banner .marca span{
  font-weight:400;font-size:12px;color:#A8A8B4;
  border-left:1px solid rgba(255,255,255,.14);padding-left:12px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;letter-spacing:.01em;
}
#banner .espaciador{flex:1;}
#banner .meta{text-align:right;font-size:11px;color:#A8A8B4;line-height:1.35;white-space:nowrap;}
#banner .meta b{display:block;color:var(--blanco);font-weight:700;font-size:12.5px;letter-spacing:-.01em;}

#menu{
  height:var(--alto-nav);display:flex;align-items:stretch;
  padding:0 20px;overflow-x:auto;scrollbar-width:none;position:relative;
}
#menu::-webkit-scrollbar{display:none;}
#menu button{
  background:transparent;border:none;color:#9A9AA6;padding:0 18px;
  font-size:13px;font-weight:700;letter-spacing:.005em;white-space:nowrap;
  position:relative;transition:color var(--normal) var(--curva);
}
#menu button::after{
  content:"";position:absolute;left:14px;right:14px;bottom:0;height:3px;
  background:var(--grad-ambar);border-radius:3px 3px 0 0;
  transform:scaleX(0);transform-origin:center;
  transition:transform var(--normal) var(--curva);
}
#menu button:hover{color:#E6E6EC;}
#menu button:hover::after{transform:scaleX(.4);}
#menu button.activo{color:var(--blanco);}
#menu button.activo::after{transform:scaleX(1);}

/* ============================================================
   FILTROS
   ============================================================ */
#barra-filtros{
  position:sticky;top:calc(var(--alto-banner) + var(--alto-nav));z-index:150;
  background:rgba(255,255,255,.86);
  -webkit-backdrop-filter:saturate(180%) blur(14px);
  backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--linea);
  padding:11px 28px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
}
.grupo-filtro{display:flex;align-items:center;gap:8px;}
.grupo-filtro > label{
  font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.11em;color:var(--texto-muy-tenue);
}
.control{
  background:var(--blanco);border:1px solid var(--borde-fuerte);border-radius:var(--radio-sm);
  padding:7px 11px;font-size:13px;font-family:inherit;color:var(--texto);
  min-height:34px;max-width:230px;box-shadow:var(--sombra-1);
  transition:border-color var(--rapido) var(--curva),box-shadow var(--rapido) var(--curva);
}
select.control{cursor:pointer;padding-right:26px;}
.control:hover{border-color:#B4B4BE;}
.control:focus{outline:none;border-color:var(--amarillo);box-shadow:0 0 0 3px var(--ambar-humo);}

.multi{position:relative;}
.multi > button{
  background:var(--blanco);border:1px solid var(--borde-fuerte);border-radius:var(--radio-sm);
  padding:7px 12px;font-size:13px;min-height:34px;min-width:180px;text-align:left;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  box-shadow:var(--sombra-1);
  transition:border-color var(--rapido) var(--curva),box-shadow var(--rapido) var(--curva);
}
.multi > button:hover{border-color:#B4B4BE;box-shadow:var(--sombra-2);}
.multi > button[aria-expanded="true"]{border-color:var(--amarillo);box-shadow:0 0 0 3px var(--ambar-humo);}
.multi > button .flecha{font-size:9px;color:var(--texto-muy-tenue);transition:transform var(--normal) var(--curva);}
.multi > button[aria-expanded="true"] .flecha{transform:rotate(180deg);}
.multi-panel{
  display:none;position:absolute;top:calc(100% + 6px);left:0;z-index:180;width:300px;
  background:var(--blanco);border:1px solid var(--linea);border-radius:var(--radio);
  box-shadow:var(--sombra-3);overflow:hidden;
  animation:emerger var(--normal) var(--curva);
}
@keyframes emerger{from{opacity:0;transform:translateY(-6px) scale(.99)}to{opacity:1;transform:none}}
.multi-panel.abierto{display:block;}
.multi-panel .acciones{display:flex;gap:8px;padding:10px 12px;border-bottom:1px solid var(--linea);background:var(--velo);}
.multi-panel .acciones button{
  flex:1;background:var(--blanco);border:1px solid var(--borde-fuerte);
  padding:6px 8px;font-size:11.5px;font-weight:700;border-radius:var(--radio-xs);
  transition:all var(--rapido) var(--curva);
}
.multi-panel .acciones button:hover{border-color:var(--tinta);background:var(--tinta);color:var(--blanco);}
.multi-panel .lista{max-height:290px;overflow-y:auto;padding:5px 0;}
.multi-panel .lista label{
  display:flex;align-items:center;gap:10px;padding:6px 14px;font-size:13px;cursor:pointer;
  transition:background var(--rapido) var(--curva);
}
.multi-panel .lista label:hover{background:var(--ambar-humo);}
.multi-panel .lista input{accent-color:var(--tinta);width:14px;height:14px;flex:none;}

#chips-filtros{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-left:auto;}
.chip{
  display:inline-flex;align-items:center;gap:6px;background:var(--blanco);
  border:1px solid var(--linea);padding:4px 11px;font-size:11.5px;
  border-radius:100px;color:var(--texto-tenue);box-shadow:var(--sombra-1);
}
.chip b{font-weight:900;color:var(--texto);}
.chip.acento{border-color:rgba(245,168,0,.45);background:var(--amarillo-suave);color:var(--alerta);}
.chip.acento b{color:var(--alerta);}

#btn-pdf{
  background:var(--grad-tinta);color:var(--blanco);border:1px solid var(--tinta);
  padding:8px 17px;font-size:12.5px;font-weight:900;border-radius:var(--radio-sm);
  min-height:34px;white-space:nowrap;letter-spacing:.01em;box-shadow:var(--sombra-2);
  transition:transform var(--rapido) var(--curva),box-shadow var(--rapido) var(--curva),background var(--rapido) var(--curva);
}
#btn-pdf:hover{background:var(--grad-ambar);color:var(--tinta);border-color:var(--ambar-bajo);box-shadow:var(--sombra-3);transform:translateY(-1px);}
#btn-pdf:active{transform:translateY(0);box-shadow:var(--sombra-1);}

.filtros-locales{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  background:var(--grad-superficie);border:1px solid var(--linea);
  border-radius:var(--radio);padding:12px 16px;margin-bottom:20px;
  box-shadow:var(--sombra-1);position:relative;overflow:hidden;
}
.filtros-locales::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--grad-ambar);
}
.filtros-locales .titulo{
  font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.11em;
  color:var(--texto-muy-tenue);margin-left:4px;
}
.filtros-locales button.limpiar{
  background:var(--blanco);border:1px solid var(--borde-fuerte);padding:6px 12px;
  font-size:11.5px;font-weight:700;border-radius:var(--radio-xs);
  transition:all var(--rapido) var(--curva);
}
.filtros-locales button.limpiar:hover{background:var(--tinta);color:var(--blanco);border-color:var(--tinta);}

/* ============================================================
   CONTENIDO
   ============================================================ */
main{padding:26px 28px 72px;max-width:1720px;margin:0 auto;}
.vista{display:none;}
.vista.activa{display:block;animation:entrar var(--normal) var(--curva);}
@keyframes entrar{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.encabezado-vista{margin-bottom:22px;}
.encabezado-vista h1{font-size:30px;line-height:1.1;letter-spacing:-.03em;}
.encabezado-vista h1 .sub{
  display:block;font-size:11px;font-weight:900;text-transform:uppercase;
  letter-spacing:.14em;color:var(--texto-muy-tenue);margin-bottom:7px;
}
/* El período va en su propia línea: pegado al título se leía como una sola frase. */
.encabezado-vista .periodo{
  display:block;width:-moz-fit-content;width:fit-content;
  margin-top:16px;font-size:13.5px;font-weight:700;letter-spacing:0;
  padding:0 0 5px;
  background-image:var(--grad-ambar);background-repeat:no-repeat;
  background-size:100% 3px;background-position:0 100%;
}
.encabezado-vista .periodo.acumulado::after{
  content:"acumulado";font-size:9px;font-weight:900;text-transform:uppercase;
  letter-spacing:.1em;color:var(--alerta);background:var(--amarillo-suave);
  border:1px solid rgba(245,168,0,.35);
  padding:2px 7px;margin-left:10px;border-radius:100px;vertical-align:middle;
}

.aviso{
  display:none;align-items:flex-start;gap:12px;
  background:linear-gradient(180deg,#FFFAF0 0%,#FFF6E3 100%);
  border:1px solid rgba(245,168,0,.32);border-left:3px solid var(--amarillo);
  border-radius:var(--radio);padding:13px 17px;margin-bottom:20px;
  font-size:13px;color:var(--alerta);box-shadow:var(--sombra-1);
}
.aviso.visible{display:flex;}
.aviso strong{font-weight:900;}

/* --- Secciones --- */
.seccion{
  margin-bottom:22px;border-radius:var(--radio);overflow:hidden;
  box-shadow:var(--sombra-2);background:var(--superficie);
  transition:box-shadow var(--normal) var(--curva);
}
.seccion:hover{box-shadow:var(--sombra-3);}
.seccion > header{
  background:var(--grad-tinta);color:var(--blanco);padding:12px 18px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:relative;
}
.seccion > header::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:0;
  background:var(--grad-ambar);transition:width var(--normal) var(--curva);
}
.seccion:hover > header::before{width:3px;}
.seccion > header h2{font-size:12.5px;font-weight:900;text-transform:uppercase;letter-spacing:.1em;}
.seccion > header .espaciador{flex:1;}
.seccion > header .pista{font-size:11px;font-weight:400;color:#9A9AA6;text-transform:none;letter-spacing:0;}
.seccion > header select{
  background:rgba(255,255,255,.08);color:var(--blanco);border:1px solid rgba(255,255,255,.18);
  border-radius:var(--radio-xs);padding:5px 9px;font-size:12px;font-family:inherit;
  cursor:pointer;max-width:260px;transition:all var(--rapido) var(--curva);
}
.seccion > header select:hover{background:rgba(255,255,255,.14);}
.seccion > header select:focus{outline:none;border-color:var(--amarillo);box-shadow:0 0 0 2px rgba(245,168,0,.35);}
.cuerpo-seccion{padding:18px;background:var(--grad-superficie);}

/* --- Tarjetas KPI --- */
.grilla-kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px;}
.grilla-kpi.cinco{grid-template-columns:repeat(5,1fr);}
.grilla-kpi > *{min-width:0;}
.kpi{
  background:var(--grad-superficie);border:1px solid var(--linea);border-radius:var(--radio);
  padding:17px 18px 15px;position:relative;overflow:hidden;box-shadow:var(--sombra-1);
  transition:transform var(--normal) var(--curva),box-shadow var(--normal) var(--curva);
}
.kpi::before{
  content:"";position:absolute;top:0;left:0;width:100%;height:3px;
  background:var(--tinta);transition:background var(--normal) var(--curva);
}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--sombra-3);}
.kpi:hover::before{background:var(--grad-ambar);}
.kpi .titulo{
  font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.11em;
  color:var(--texto-muy-tenue);margin-bottom:10px;
}
.kpi .valor{
  font-size:34px;font-weight:900;line-height:1;letter-spacing:-.035em;
  font-variant-numeric:tabular-nums;
}
.grilla-kpi.cinco .kpi .valor{font-size:27px;}
.kpi .unidad{font-size:12px;font-weight:700;color:var(--texto-muy-tenue);margin-left:6px;letter-spacing:0;}
.kpi .pie{
  margin-top:12px;padding-top:10px;border-top:1px solid var(--linea);
  font-size:11.5px;color:var(--texto-tenue);display:flex;flex-wrap:wrap;gap:5px 10px;align-items:center;
}
.kpi .secundario{margin-top:10px;font-size:12.5px;color:var(--texto-tenue);}
.kpi .secundario b{font-weight:900;color:var(--texto);font-size:15px;font-variant-numeric:tabular-nums;}
.kpi.error{background:linear-gradient(180deg,#FEF7F6 0%,#FDF1F0 100%);border-color:#F0D4D1;}
.kpi.error::before{background:var(--negativo);}
.kpi .msj-error{font-size:12px;color:var(--negativo);font-weight:700;line-height:1.4;}

.var{font-weight:900;white-space:nowrap;font-variant-numeric:tabular-nums;}
.var.sube{color:var(--alerta);}
.var.baja{color:var(--negativo);}
.var.plana{color:var(--texto-tenue);}
.var.nula{color:var(--texto-muy-tenue);font-weight:700;}
.kpi .pie .var.sube{background:var(--amarillo-suave);padding:2px 8px;border-radius:100px;border:1px solid rgba(245,168,0,.3);}
.kpi .pie .var.baja{background:#FDF1F0;padding:2px 8px;border-radius:100px;border:1px solid #F0D4D1;}

/* --- Gráficos --- */
.caja-grafico{position:relative;width:100%;height:340px;}
.caja-grafico.alta{height:470px;}
.caja-grafico.baja{height:255px;}
.grilla-2{display:grid;grid-template-columns:1.45fr 1fr;gap:18px;}
.grilla-mitad{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.grilla-evolucion{display:grid;grid-template-columns:1fr 1fr;gap:18px;}

/* CORRECCIÓN DE DESBORDE
   Los hijos de una grilla tienen min-width:auto, así que no se encogen por debajo
   del ancho mínimo de su contenido. Una tabla ancha empujaba la columna y el bloque
   se salía del contenedor. Con min-width:0 la tabla vuelve a caber y su propio
   envoltorio se encarga del desplazamiento horizontal. */
.grilla-2 > *,.grilla-mitad > *,.grilla-evolucion > *{min-width:0;}
.cuerpo-seccion > div{max-width:100%;}

.grilla-evolucion .mini{
  border:1px solid var(--linea);border-radius:var(--radio);overflow:hidden;
  background:var(--superficie);box-shadow:var(--sombra-1);
  transition:box-shadow var(--normal) var(--curva),transform var(--normal) var(--curva);
}
.grilla-evolucion .mini:hover{box-shadow:var(--sombra-2);transform:translateY(-1px);}
.grilla-evolucion .mini h3{
  font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.1em;
  padding:10px 14px;background:var(--velo);border-bottom:1px solid var(--linea);color:var(--texto);
}
.grilla-evolucion .mini .cuerpo{padding:14px;}
.grilla-evolucion .mini .caja-grafico{height:255px;}

/* --- Tablas --- */
.envoltorio-tabla{
  overflow-x:auto;border:1px solid var(--linea);border-radius:var(--radio);
  background:var(--blanco);max-width:100%;
}
.envoltorio-tabla.limitada{max-height:540px;overflow-y:auto;}
table.datos{font-size:12.5px;min-width:720px;}
table.datos.compacta{min-width:0;}
table.datos thead th{
  background:var(--tinta);color:var(--blanco);font-weight:700;text-align:right;
  padding:10px 12px;white-space:nowrap;position:sticky;top:0;z-index:2;
  font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;
  border-bottom:2px solid var(--amarillo);
}
table.datos thead th.izq{text-align:left;}
table.datos thead th.ordenable{cursor:pointer;user-select:none;transition:color var(--rapido) var(--curva);}
table.datos thead th.ordenable:hover{color:var(--ambar-alto);}
table.datos thead th .ind{opacity:.32;margin-left:6px;font-size:9px;}
table.datos thead th.ord-asc .ind,table.datos thead th.ord-desc .ind{opacity:1;color:var(--amarillo);}
table.datos thead tr.grupo th{background:var(--tinta-2);border-bottom:1px solid rgba(255,255,255,.12);text-align:center;font-size:10px;color:#C6C6D0;}
table.datos tbody td{
  padding:8px 12px;text-align:right;border-bottom:1px solid var(--linea);
  font-variant-numeric:tabular-nums;white-space:nowrap;
}
table.datos tbody td.izq{text-align:left;font-weight:700;white-space:normal;min-width:170px;position:relative;}
table.datos tbody td.izq.normal{font-weight:400;}
table.datos tbody tr{transition:background var(--rapido) var(--curva);}
table.datos tbody tr:nth-child(even){background:var(--superficie-alt);}
table.datos tbody tr:hover{background:var(--ambar-humo);}
table.datos tbody tr td:first-child::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:0;
  background:var(--grad-ambar);transition:width var(--rapido) var(--curva);
}
table.datos tbody tr:hover td:first-child::before{width:3px;}
table.datos tfoot td{
  padding:10px 12px;text-align:right;font-weight:900;background:var(--velo);
  border-top:2px solid var(--tinta);font-variant-numeric:tabular-nums;
}
table.datos tfoot td.izq{text-align:left;}
td.sep-izq,th.sep-izq{border-left:1px solid var(--linea);}

.sin-dato{color:var(--texto-muy-tenue);font-style:italic;font-weight:400;}
.cero{color:var(--texto);font-weight:700;}

.barra-prop{display:block;height:4px;background:var(--linea);margin-top:4px;border-radius:100px;overflow:hidden;}
.barra-prop i{display:block;height:100%;background:var(--grad-ambar);border-radius:100px;transition:width var(--normal) var(--curva);}

/* --- Ranking --- */
ol.ranking{list-style:none;margin:0;padding:0;counter-reset:r;}
ol.ranking li{
  counter-increment:r;display:flex;align-items:center;gap:14px;
  padding:10px 8px;border-bottom:1px solid var(--linea);font-size:13px;
  border-radius:var(--radio-xs);transition:background var(--rapido) var(--curva);
}
ol.ranking li:hover{background:var(--ambar-humo);}
ol.ranking li:last-child{border-bottom:none;}
ol.ranking li::before{
  content:counter(r);flex:none;width:24px;height:24px;background:var(--tinta);color:var(--blanco);
  font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;
  border-radius:var(--radio-xs);box-shadow:var(--sombra-1);
}
ol.ranking li:nth-child(-n+3)::before{background:var(--grad-ambar);color:var(--tinta);}
ol.ranking li .nom{flex:1;min-width:0;font-weight:700;}
ol.ranking li .num{font-weight:900;font-variant-numeric:tabular-nums;}
ol.ranking li .sec{font-size:11.5px;color:var(--texto-muy-tenue);font-weight:400;}

/* --- Estados --- */
.esqueleto{background:linear-gradient(90deg,#EFEFF2 25%,#E4E4E9 37%,#EFEFF2 63%);background-size:400% 100%;animation:brillo 1.4s ease-in-out infinite;border-radius:var(--radio-xs);}
@keyframes brillo{0%{background-position:100% 50%}100%{background-position:0 50%}}
#capa-carga{
  position:fixed;inset:0;background:var(--blanco);z-index:400;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
}
#capa-carga.oculta{display:none;}
#capa-carga .aro{
  width:40px;height:40px;border:3px solid var(--linea);border-top-color:var(--amarillo);
  border-radius:50%;animation:girar .8s linear infinite;
}
@keyframes girar{to{transform:rotate(360deg)}}
#capa-carga .txt{font-size:14px;font-weight:900;color:var(--texto);letter-spacing:-.01em;}
#capa-carga .detalle{font-size:12px;color:var(--texto-muy-tenue);}

.bloque-error{
  background:linear-gradient(180deg,#FEF7F6 0%,#FDF1F0 100%);
  border:1px solid #F0D4D1;border-left:3px solid var(--negativo);
  border-radius:var(--radio);padding:17px 19px;font-size:13px;color:#7A1C16;box-shadow:var(--sombra-1);
}
.bloque-error strong{display:block;font-weight:900;margin-bottom:5px;}
.bloque-error code{font-size:11.5px;background:rgba(0,0,0,.05);padding:2px 6px;border-radius:4px;word-break:break-all;}

.nota{font-size:11.5px;color:var(--texto-muy-tenue);margin-top:12px;line-height:1.55;max-width:105ch;}
.vacio{padding:38px;text-align:center;color:var(--texto-muy-tenue);font-size:13px;}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width:1180px){
  .grilla-2,.grilla-mitad,.grilla-evolucion{grid-template-columns:1fr;}
  .grilla-kpi{grid-template-columns:repeat(2,1fr);}
  .grilla-kpi.cinco{grid-template-columns:repeat(3,1fr);}
}
@media (max-width:820px){
  main{padding:18px 14px 52px;}
  #banner,#barra-filtros{padding-left:16px;padding-right:16px;}
  #banner .marca span{display:none;}
  .grilla-kpi,.grilla-kpi.cinco{grid-template-columns:1fr;}
  #chips-filtros{margin-left:0;width:100%;}
  .encabezado-vista h1{font-size:23px;}
}

/* ============================================================
   IMPRESIÓN
   El PDF no hereda el tema de pantalla: se imprime plano, sin sombras
   ni degradados de superficie. Los degradados suaves salen sucios en tóner.
   ============================================================ */
#cabecera-impresion{display:none;}

@media print{
  @page{size:letter landscape;margin:11mm 10mm 12mm;}
  html,body{background:#fff !important;font-size:9pt;}
  #cabecera,#barra-filtros,#capa-carga,#btn-pdf,.seccion > header select,.multi,
  .filtros-locales select,.filtros-locales button{display:none !important;}
  main{padding:0;max-width:none;}
  .vista{display:none !important;}
  .vista.activa{display:block !important;animation:none;}

  /* Se aplana todo: sin sombras, sin degradados, sin esquinas redondeadas. */
  .seccion,.kpi,.envoltorio-tabla,.filtros-locales,.aviso,.bloque-error,
  .grilla-evolucion .mini,.chip,ol.ranking li::before{
    box-shadow:none !important;border-radius:0 !important;
  }
  .kpi,.cuerpo-seccion,.filtros-locales,.grilla-evolucion .mini h3{background:#fff !important;}
  .seccion:hover{box-shadow:none !important;}
  .seccion > header::before,.kpi::before{display:none;}
  table.datos tbody tr td:first-child::before{display:none;}

  #cabecera-impresion{display:block;border-bottom:3px solid #000;padding-bottom:7px;margin-bottom:12px;}
  #cabecera-impresion .fila-sup{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;}
  #cabecera-impresion .inst{font-size:14pt;font-weight:900;line-height:1.1;}
  #cabecera-impresion .inst span{display:block;font-size:7.5pt;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:#444;margin-top:2px;}
  #cabecera-impresion .der{text-align:right;font-size:7.5pt;color:#333;line-height:1.4;}
  #cabecera-impresion .der b{display:block;font-size:10pt;color:#000;}
  #cabecera-impresion .filtros{margin-top:7px;font-size:7.5pt;color:#333;line-height:1.4;border-top:1px solid #CCC;padding-top:5px;}
  #cabecera-impresion .filtros b{font-weight:900;color:#000;}

  .encabezado-vista{margin-bottom:9px;}
  .encabezado-vista h1{font-size:12pt;}
  .encabezado-vista h1 .sub{font-size:7pt;}
  .encabezado-vista .periodo{background-image:none;border-bottom:2px solid #000;}

  .seccion,.kpi,.envoltorio-tabla,.caja-grafico,.grilla-evolucion .mini{break-inside:avoid;page-break-inside:avoid;}
  .seccion{margin-bottom:11px;border:1px solid #CCC;}
  .seccion > header{padding:5px 9px;background:#000 !important;}
  .seccion > header h2{font-size:8pt;}
  .cuerpo-seccion{padding:9px;}
  .filtros-locales{padding:5px 9px;margin-bottom:9px;font-size:7.5pt;border:1px solid #CCC;}

  .grilla-kpi{grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:11px;}
  .grilla-kpi.cinco{grid-template-columns:repeat(5,1fr);}
  .kpi{padding:8px 9px;border:1px solid #CCC;}
  .kpi .valor{font-size:16pt;}
  .grilla-kpi.cinco .kpi .valor{font-size:13pt;}
  .kpi .titulo{font-size:6.5pt;margin-bottom:5px;}
  .kpi .pie,.kpi .secundario{font-size:7pt;}

  .grilla-2{grid-template-columns:1.45fr 1fr;gap:10px;}
  .grilla-mitad,.grilla-evolucion{grid-template-columns:1fr 1fr;gap:10px;}
  .caja-grafico{height:70mm;}
  .caja-grafico.alta{height:88mm;}
  .caja-grafico.baja{height:55mm;}
  .grilla-evolucion .mini .caja-grafico{height:52mm;}

  table.datos{font-size:7pt;min-width:0;}
  table.datos thead th{padding:4px 5px;font-size:6.5pt;position:static;background:#000 !important;color:#fff !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  table.datos tbody td{padding:3px 5px;}
  table.datos tbody tr:hover{background:transparent;}
  table.datos thead{display:table-header-group;}
  table.datos tfoot td{padding:4px 5px;background:#F2F2F2 !important;}
  .envoltorio-tabla.limitada{max-height:none;overflow:visible;}
  ol.ranking li{padding:3px 2px;font-size:7pt;}
  ol.ranking li::before{width:14px;height:14px;font-size:6pt;background:#000 !important;color:#fff !important;}

  .aviso{display:flex !important;background:#FFF6E3 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;padding:6px 9px;font-size:7.5pt;margin-bottom:9px;border:1px solid #E0B860;}
  .aviso:not(.visible){display:none !important;}
  .nota{font-size:6.5pt;}

  .kpi,table.datos tbody tr:nth-child(even),table.datos tfoot td,
  .var.sube,.var.baja,.barra-prop i{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
}
</style>

/* ==================================================================================
   UTILIDADES
   ================================================================================== */
function norm(t){
  return String(t == null ? "" : t)
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .toLowerCase().replace(/\s+/g, " ").trim();
}
function clave(t){ return norm(t).replace(/[^a-z0-9]/g, ""); }

function parsearNumero(bruto){
  if (bruto === null || bruto === undefined) return null;
  if (typeof bruto === "number") return Number.isFinite(bruto) ? bruto : null;
  let t = String(bruto).trim();
  if (CONFIG.valoresSinDato.includes(norm(t))) return null;
  t = t.replace(/[\s  ]/g, "").replace(/[$%]/g, "");
  if (t === "") return null;
  const negativo = /^\(.*\)$/.test(t);
  if (negativo) t = t.slice(1, -1);
  const tienePunto = t.includes("."), tieneComa = t.includes(",");
  if (tienePunto && tieneComa){
    if (t.lastIndexOf(",") > t.lastIndexOf(".")) t = t.replace(/\./g, "").replace(",", ".");
    else t = t.replace(/,/g, "");
  } else if (tieneComa){
    t = /^\d{1,3}(,\d{3})+$/.test(t) ? t.replace(/,/g, "") : t.replace(",", ".");
  } else if (tienePunto){
    if (/^\d{1,3}(\.\d{3})+$/.test(t)) t = t.replace(/\./g, "");
  }
  if (!/^-?\d*\.?\d+$/.test(t)) return null;
  const n = parseFloat(t);
  if (!Number.isFinite(n)) return null;
  return negativo ? -n : n;
}

function validaPeriodo(anio, mes){
  if (!Number.isInteger(anio) || !Number.isInteger(mes)) return null;
  if (anio < 1990 || anio > 2100 || mes < 1 || mes > 12) return null;
  return { anio, mes };
}
function mesDesdeTexto(txt){
  const n = norm(txt).replace(/\./g, "").trim();
  if (ALIAS_MESES[n]) return ALIAS_MESES[n];
  return ALIAS_MESES[n.slice(0, 3)] || null;
}

function parsearPeriodo(bruto, formato){
  if (bruto === null || bruto === undefined) return null;
  if (bruto instanceof Date && !isNaN(bruto)) return { anio: bruto.getFullYear(), mes: bruto.getMonth() + 1 };
  const t = String(bruto).trim();
  if (t === "") return null;
  let m;
  m = t.match(/^(\d{4})[-\/.](\d{1,2})(?:[-\/.](\d{1,2}))?/);
  if (m) return validaPeriodo(+m[1], +m[2]);
  m = t.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/);
  if (m){
    let a = +m[3]; if (a < 100) a += 2000;
    const p1 = +m[1], p2 = +m[2];
    if (p1 > 12 && p2 <= 12) return validaPeriodo(a, p2);
    if (p2 > 12 && p1 <= 12) return validaPeriodo(a, p1);
    return validaPeriodo(a, (formato || CONFIG.formatoFecha) === "MDY" ? p1 : p2);
  }
  m = t.match(/^(\d{1,2})[-\/.](\d{4})$/);
  if (m) return validaPeriodo(+m[2], +m[1]);
  m = t.match(/^(\d{4})(\d{2})$/);
  if (m) return validaPeriodo(+m[1], +m[2]);
  const n = norm(t);
  const cn = n.match(/^([a-z]+)\.?[\s\-\/]*(\d{2,4})$/) || n.match(/^(\d{4})[\s\-\/]*([a-z]+)\.?$/);
  if (cn){
    const primeroTexto = isNaN(+cn[1]);
    const txt = primeroTexto ? cn[1] : cn[2];
    let a = +(primeroTexto ? cn[2] : cn[1]); if (a < 100) a += 2000;
    const mes = mesDesdeTexto(txt);
    if (mes) return validaPeriodo(a, mes);
  }
  const d = new Date(t);
  if (!isNaN(d) && /\d{4}/.test(t)) return validaPeriodo(d.getFullYear(), d.getMonth() + 1);
  return null;
}

/** Deduce M/D vs D/M mirando los datos: un componente > 12 no deja lugar a dudas. */
function detectarFormatoFecha(valores){
  let mdy = 0, dmy = 0;
  for (const v of valores){
    const m = String(v == null ? "" : v).trim().match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/);
    if (!m) continue;
    const p1 = +m[1], p2 = +m[2];
    if (p1 > 12 && p2 <= 12) dmy++;
    else if (p2 > 12 && p1 <= 12) mdy++;
  }
  if (mdy === 0 && dmy === 0) return null;
  return { formato: mdy >= dmy ? "MDY" : "DMY", mdy, dmy, conflicto: mdy > 0 && dmy > 0 };
}

/* ---------- Formateo chileno ---------- */
const FMT_ENTERO  = new Intl.NumberFormat("es-CL", { maximumFractionDigits: 0 });
const FMT_DECIMAL = new Intl.NumberFormat("es-CL", { minimumFractionDigits: 1, maximumFractionDigits: 1 });

function fmt(n){
  if (n === null || n === undefined || !Number.isFinite(n)) return '<span class="sin-dato">sin dato</span>';
  if (n === 0) return '<span class="cero">0</span>';
  return FMT_ENTERO.format(Math.round(n));
}
function fmtTxt(n){
  if (n === null || n === undefined || !Number.isFinite(n)) return "sin dato";
  return FMT_ENTERO.format(Math.round(n));
}
function pct(parte, total){
  if (!total || parte === null || parte === undefined) return "—";
  return FMT_DECIMAL.format((parte / total) * 100) + "%";
}
function variacion(actual, anterior){
  if (actual === null || anterior === null || anterior === 0) return null;
  return ((actual - anterior) / anterior) * 100;
}
function htmlVariacion(v, conFlecha){
  if (v === null) return '<span class="var nula">n/a</span>';
  const cls = v > 0.05 ? "sube" : (v < -0.05 ? "baja" : "plana");
  const flecha = conFlecha === false ? "" : (v > 0.05 ? "▲ " : (v < -0.05 ? "▼ " : "= "));
  return '<span class="var ' + cls + '">' + flecha + (v > 0 ? "+" : "") + FMT_DECIMAL.format(v) + "%</span>";
}
function escapar(t){
  return String(t == null ? "" : t).replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function nombreMes(m){ return CONFIG.meses[m - 1] || "—"; }
function etiquetaPeriodo(p){ return p ? nombreMes(p.mes) + " " + p.anio : "—"; }

async function cargarTodo(){
  const total = CONFIG.indicadores.length;
  let listas = 0;
  const avisar = (nombre) => {
    listas++;
    const el = document.getElementById("detalle-carga");
    if (el) el.textContent = "Procesando " + listas + " de " + total + " hojas · " + nombre;
  };

  /* allSettled y no all: si una hoja falla, el resto del dashboard sigue funcionando. */
  const resultados = await Promise.allSettled(CONFIG.indicadores.map(ind =>
    descargarHoja(ind).then(r => { avisar(ind.nombre); return r; },
                            e => { avisar(ind.nombre); throw e; })));

  resultados.forEach((r, i) => {
    const ind = CONFIG.indicadores[i];
    if (r.status === "fulfilled") ESTADO.datos[ind.id] = r.value;
    else {
      const msj = (r.reason && r.reason.message) ? r.reason.message : "error desconocido";
      ESTADO.datos[ind.id] = { estado: "error", error: msj, cubos: {}, total: new Map(),
                               actividades: null, unicos: null, totalUnicos: 0,
                               sedes: new Set(), anios: new Set(), detalle: null };
      anotar("Carga", "No se pudo cargar «" + ind.nombre + "»: " + msj);
    }
  });

  /* Las matrices ya no se necesitan: se libera la memoria de las 318.000 filas. */
  CACHE_HOJAS.clear();

  ESTADO.cargadoEn = new Date();
  consolidarUniverso();
}

function esOrigenLocal(){
  try { return location.protocol === "file:" || location.origin === "null" || location.origin === ""; }
  catch (e){ return false; }
}

/* Caché de hojas ya descargadas y parseadas.
   Material bibliográfico y no bibliográfico salen de la MISMA hoja de 33 MB, así que
   se descarga y parsea una sola vez y cada indicador filtra lo suyo. */
const CACHE_HOJAS = new Map();
function matrizDe(gid){
  if (!CACHE_HOJAS.has(gid)) CACHE_HOJAS.set(gid, descargarMatriz(gid));
  return CACHE_HOJAS.get(gid);
}

async function descargarMatriz(gid){
  const url = urlHoja(gid);
  let texto;
  try {
    const resp = await fetch(url, { cache: "no-store", redirect: "follow" });
    if (!resp.ok) throw new Error("HTTP " + resp.status + " " + resp.statusText);
    texto = await resp.text();
  } catch (e){
    if (esOrigenLocal()){
      throw new Error("El navegador bloqueó la descarga porque el dashboard se abrió como archivo local (file://). " +
        "Necesita ejecutarse desde un servidor web: súbelo a GitHub Pages o levanta un servidor local.");
    }
    throw new Error("No se pudo descargar el CSV (" + e.message + "). Verifica que la hoja siga publicada en la web.");
  }
  if (/^\s*<(!doctype|html)/i.test(texto)){
    throw new Error("La URL no devolvió un CSV. Es probable que la hoja ya no esté publicada o que el gid haya cambiado.");
  }

  const parsed = Papa.parse(texto, { header: false, skipEmptyLines: "greedy", dynamicTyping: false });
  if (!parsed.data || parsed.data.length === 0) throw new Error("La hoja está vacía.");
  return parsed.data;
}

async function descargarHoja(ind){
  const matriz = await matrizDe(ind.gid);
  return ind.tipoHoja === "matriz" ? leerMatriz(ind, matriz) : leerTransaccional(ind, matriz);
}

/* ==================================================================================
   LECTURA DE HOJAS TRANSACCIONALES

   Se agrega al vuelo en cubos. Nunca se retienen las filas originales, salvo en
   Acciones Formativas (26.917 filas), que se guarda en forma compacta porque su vista
   necesita filtros propios y contar RUT únicos.

   Estructura resultante:
     total          Map("sede|anio|mes" -> conteo)
     cubos[dim]     Map("sede|anio|mes|valor" -> conteo)
     actividades    Map("sede|anio|mes" -> Set(claves))     solo si hay claveActividad
     detalle        { cols, filas }  códigos enteros        solo si detalle: true
   ================================================================================== */
function leerTransaccional(ind, matriz){
  const idxEnc = buscarEncabezado(matriz, [ind.col.sede, "sede", "biblioteca"]);
  if (idxEnc === -1){
    throw new Error("No se encontró la fila de encabezados. Se esperaba la columna «" + ind.col.sede + "».");
  }
  const enc = matriz[idxEnc].map(c => String(c == null ? "" : c).trim());
  const iSede = buscarColumna(enc, ind.col.sede, ["sede", "biblioteca", "campus"]);
  const iFecha = buscarColumna(enc, ind.col.fecha, ["fecha", "dia", "periodo"]);
  if (iSede === -1 || iFecha === -1){
    throw new Error("Faltan las columnas de sede o fecha. Encabezados: " + enc.filter(Boolean).join(" | "));
  }

  /* Índices de cada dimensión declarada. */
  const dims = [];
  for (const [id, def] of Object.entries(ind.dimensiones || {})){
    if (def.cols){
      /* Dimensión cruzada: el valor del cubo es la combinación de dos columnas. */
      const idx = def.cols.map(c => buscarColumna(enc, c, []));
      if (idx.some(i => i === -1)){
        anotar("Formato", ind.nombre + ": faltan columnas para el cruce «" + def.etiqueta + "» (" + def.cols.join(" × ") + ").");
      } else {
        dims.push({ id, idx, etiqueta: def.etiqueta, cruzada: true });
      }
      continue;
    }
    const i = buscarColumna(enc, def.col, []);
    if (i === -1) anotar("Formato", ind.nombre + ": no se encontró la columna «" + def.col + "» para el desglose «" + def.etiqueta + "».");
    else dims.push({ id, i, etiqueta: def.etiqueta });
  }
  const iRut = ind.colRut ? buscarColumna(enc, ind.colRut, []) : -1;
  /* Identidad para el conteo de únicos. Se guardan conjuntos por sede y mes: los
     únicos NO son aditivos, así que al consultar hay que unir, nunca sumar. */
  const iUnico = ind.colUnico ? buscarColumna(enc, ind.colUnico, []) : -1;

  /* Filtro fijo: permite derivar dos indicadores independientes de la misma hoja.
     Material bibliográfico y no bibliográfico se distinguen por CAT3 ITEM. */
  const ff = ind.filtroFijo;
  const iFF = ff ? buscarColumna(enc, ff.col, []) : -1;
  if (ff && iFF === -1){
    throw new Error("No se encontró la columna «" + ff.col + "», necesaria para separar " + ind.nombre + ".");
  }
  const valoresFF = ff ? new Set(ff.valores.map(norm)) : null;
  if (ind.colUnico && iUnico === -1){
    anotar("Formato", ind.nombre + ": no se encontró la columna «" + ind.colUnico + "» para contar usuarios únicos.");
  }

  /* Orden día/mes deducido de los propios datos. */
  const muestra = [];
  for (let i = idxEnc + 1; i < matriz.length && muestra.length < 4000; i++){
    if (matriz[i] && matriz[i][iFecha] != null) muestra.push(matriz[i][iFecha]);
  }
  const det = detectarFormatoFecha(muestra);
  const formatoFecha = det ? det.formato : CONFIG.formatoFecha;
  if (det && det.conflicto) anotar("Fechas", ind.nombre + ": la columna de fecha mezcla M/D y D/M (" + det.mdy + " vs " + det.dmy + "). Se usó " + det.formato + ".");
  else if (det && det.formato !== CONFIG.formatoFecha) anotar("Fechas", ind.nombre + ": las fechas vienen en " + det.formato + " y CONFIG dice " + CONFIG.formatoFecha + ". Se usó " + det.formato + ".");

  const total = new Map();
  const cubos = {};
  dims.forEach(d => { cubos[d.id] = new Map(); });
  const actividades = ind.claveActividad ? new Map() : null;
  const unicos = iUnico !== -1 ? new Map() : null;
  const codUnico = new Map();
  const sedes = new Set(), anios = new Set();
  const valoresDim = {};
  dims.forEach(d => { valoresDim[d.id] = new Set(); });

  /* Almacén compacto: diccionarios de strings + filas de códigos enteros. */
  const guardaDetalle = !!ind.detalle;
  const dicc = {}, diccInv = {};
  dims.forEach(d => { dicc[d.id] = new Map(); diccInv[d.id] = []; });
  dicc.sede = new Map(); diccInv.sede = [];
  const filasDetalle = [];
  const rutsGlobal = guardaDetalle ? new Map() : null;

  function codificar(campo, valor){
    let c = dicc[campo].get(valor);
    if (c === undefined){ c = diccInv[campo].length; dicc[campo].set(valor, c); diccInv[campo].push(valor); }
    return c;
  }

  const cachePeriodo = new Map();
  let leidas = 0, sinFecha = 0, excluidas = 0;

  for (let f = idxEnc + 1; f < matriz.length; f++){
    const fila = matriz[f];
    if (!fila) continue;
    /* El filtro fijo se aplica antes de todo: esta fila puede no pertenecer a
       este indicador aunque venga en la misma hoja. */
    if (valoresFF && !valoresFF.has(norm(fila[iFF] == null ? "" : String(fila[iFF]).trim()))) continue;

    const sedeBruta = fila[iSede] == null ? "" : String(fila[iSede]).trim();
    if (sedeBruta === "" || esFilaTotal(sedeBruta)) continue;
    leidas++;

    const sede = normalizarSede(sedeBruta);
    if (sede === null){ excluidas++; continue; }

    const brutoFecha = fila[iFecha];
    const kf = String(brutoFecha);
    let periodo = cachePeriodo.get(kf);
    if (periodo === undefined){ periodo = parsearPeriodo(brutoFecha, formatoFecha); cachePeriodo.set(kf, periodo); }
    if (!periodo){ sinFecha++; continue; }

    const base = sede + "|" + periodo.anio + "|" + periodo.mes;
    total.set(base, (total.get(base) || 0) + 1);
    sedes.add(sede); anios.add(periodo.anio);

    for (const d of dims){
      const v = valorDimension(fila, d);
      valoresDim[d.id].add(v);
      const k = base + "|" + v;
      cubos[d.id].set(k, (cubos[d.id].get(k) || 0) + 1);
    }

    if (unicos){
      const bruto = fila[iUnico] == null ? "" : String(fila[iUnico]).trim();
      if (bruto !== ""){
        let c = codUnico.get(bruto);
        if (c === undefined){ c = codUnico.size; codUnico.set(bruto, c); }
        let set = unicos.get(base);
        if (!set){ set = new Set(); unicos.set(base, set); }
        set.add(c);
      }
    }

    if (actividades){
      let set = actividades.get(base);
      if (!set){ set = new Set(); actividades.set(base, set); }
      const partes = ind.claveActividad.map(c => c === "fecha" ? kf : String(fila[(dims.find(d => d.id === c) || {}).i] || ""));
      set.add(partes.join(""));
    }

    if (guardaDetalle){
      const reg = { s: codificar("sede", sede), a: periodo.anio, m: periodo.mes, f: kf };
      for (const d of dims) reg[d.id] = codificar(d.id, valorDimension(fila, d));
      if (iRut !== -1){
        const rut = String(fila[iRut] == null ? "" : fila[iRut]).trim();
        let cr = rutsGlobal.get(rut);
        if (cr === undefined){ cr = rutsGlobal.size; rutsGlobal.set(rut, cr); }
        reg.rut = cr;
      }
      filasDetalle.push(reg);
    }
  }

  if (total.size === 0) throw new Error("Se leyeron " + FMT_ENTERO.format(leidas) + " filas pero ninguna resultó utilizable.");
  if (sinFecha) anotar("Datos", ind.nombre + ": " + FMT_ENTERO.format(sinFecha) + " filas sin fecha interpretable quedaron fuera.");
  if (excluidas) anotar("Datos", ind.nombre + ": " + FMT_ENTERO.format(excluidas) + " filas de unidades excluidas por configuración.");
  anotar("Lectura", ind.nombre + ": " + FMT_ENTERO.format(leidas) + " filas agregadas · sede «" + enc[iSede] + "» · fecha «" + enc[iFecha] + "» · desgloses: " + dims.map(d => d.id).join(", "));

  const listasDim = {};
  Object.entries(valoresDim).forEach(([id, s]) => { listasDim[id] = [...s].sort((a, b) => a.localeCompare(b, "es")); });

  return {
    estado: "ok", error: null, total, cubos, actividades, unicos,
    totalUnicos: codUnico.size,
    sedes, anios, filasLeidas: leidas, valoresDim: listasDim,
    detalle: guardaDetalle ? { filas: filasDetalle, dicc: diccInv, ruts: rutsGlobal.size } : null
  };
}

/* ---------- Hoja ya agregada: sedes en filas, meses en columnas ---------- */
function leerMatriz(ind, matriz){
  const idxEnc = buscarEncabezado(matriz, [ind.col.sede, "sede"]);
  if (idxEnc === -1) throw new Error("No se encontró la fila de encabezados con la columna de sede.");
  const enc = matriz[idxEnc].map(c => String(c == null ? "" : c).trim());
  const iSede = buscarColumna(enc, ind.col.sede, ["sede", "biblioteca", "campus"]);

  const colsMes = [];
  enc.forEach((h, i) => {
    if (i === iSede || !h) return;
    const mes = mesDesdeTexto(h);
    if (mes) colsMes.push({ i, mes });
  });
  if (colsMes.length === 0) throw new Error("No se reconoció ninguna columna de mes en: " + enc.filter(Boolean).join(" | "));

  /* El año sale de una columna suelta de 4 dígitos (el total anual) o de los títulos. */
  let anio = null;
  const colAnio = enc.findIndex((h, i) => i !== iSede && /^(19|20)\d{2}$/.test(String(h).trim()));
  if (colAnio !== -1) anio = +enc[colAnio].trim();
  if (anio === null){
    for (let i = 0; i < idxEnc; i++){
      const m = (matriz[i] || []).join(" ").match(/(19|20)\d{2}/);
      if (m){ anio = +m[0]; break; }
    }
  }
  if (anio === null){ anio = new Date().getFullYear(); anotar("Formato", ind.nombre + ": no se pudo determinar el año; se asumió " + anio + "."); }

  const total = new Map();
  const sedes = new Set(), anios = new Set();
  let excluidas = 0;

  for (let f = idxEnc + 1; f < matriz.length; f++){
    const fila = matriz[f];
    if (!fila) continue;
    const sedeBruta = fila[iSede] == null ? "" : String(fila[iSede]).trim();
    if (sedeBruta === "" || esFilaTotal(sedeBruta)) continue;
    const sede = normalizarSede(sedeBruta);
    if (sede === null){ excluidas++; continue; }

    colsMes.forEach(cm => {
      const bruto = fila[cm.i];
      if (String(bruto == null ? "" : bruto).trim() === "") return;  // mes aún no ocurrido
      const v = parsearNumero(bruto);
      if (v === null) return;
      total.set(sede + "|" + anio + "|" + cm.mes, v);
    });
    sedes.add(sede); anios.add(anio);
  }

  if (total.size === 0) throw new Error("No se pudo leer ninguna sede con datos mensuales.");
  if (excluidas) anotar("Datos", ind.nombre + ": " + excluidas + " filas de unidades excluidas.");
  anotar("Lectura", ind.nombre + ": matriz de " + colsMes.length + " meses, año " + anio + ", " + total.size + " celdas.");

  return { estado: "ok", error: null, total, cubos: {}, actividades: null, unicos: null,
           totalUnicos: 0, sedes, anios, filasLeidas: 0, valoresDim: {}, detalle: null };
}

/** Valor de una dimensión en una fila. Las cruzadas unen dos columnas con SEP_CRUCE. */
function valorDimension(fila, d){
  if (d.cruzada){
    return d.idx.map(i => {
      const v = fila[i] == null ? "" : String(fila[i]).trim();
      return v === "" ? CONFIG.etiquetaVacio : v;
    }).join(SEP_CRUCE);
  }
  const v = fila[d.i] == null ? "" : String(fila[d.i]).trim();
  return v === "" ? CONFIG.etiquetaVacio : v;
}
const SEP_CRUCE = "\u241F";

/* ---------- Apoyos de lectura ---------- */
function buscarEncabezado(matriz, candidatos){
  const limite = Math.min(matriz.length, 15);
  for (let i = 0; i < limite; i++){
    const fila = (matriz[i] || []).map(c => norm(c));
    const tiene = candidatos.some(c => fila.some(h => h === norm(c) || h.includes(norm(c))));
    if (tiene && fila.filter(h => h !== "").length >= 2) return i;
  }
  return -1;
}
function buscarColumna(enc, nombre, alternativas){
  if (nombre){
    const exacto = enc.findIndex(h => norm(h) === norm(nombre));
    if (exacto !== -1) return exacto;
  }
  for (const alt of (alternativas || [])){
    const i = enc.findIndex(h => h && norm(h).includes(norm(alt)));
    if (i !== -1) return i;
  }
  return -1;
}
function esFilaTotal(txt){
  return ["total", "totales", "total general", "suma", "total sistema", "sistema", "resultado"].includes(norm(txt));
}

/**
 * Nombre canónico de sede. Devuelve null si la unidad está excluida.
 * Un nombre no reconocido se conserva tal cual y se anota en la consola.
 */
function normalizarSede(bruta){
  const k = clave(bruta);
  if (MAPA_SEDES.excluidas.has(k)) return null;
  const canon = MAPA_SEDES.directo.get(k);
  if (canon) return canon;
  anotar("Sede", "«" + bruta + "» no está en la lista configurada; se incluye con ese nombre.");
  return bruta;
}
const MAPA_SEDES = (function(){
  const directo = new Map(), excluidas = new Set();
  CONFIG.sedes.canonicas.forEach(s => directo.set(clave(s), s));
  Object.entries(CONFIG.sedes.alias).forEach(([d, h]) => directo.set(clave(d), h));
  CONFIG.sedes.excluidas.forEach(s => excluidas.add(clave(s)));
  return { directo, excluidas };
})();

/* ==================================================================================
   CONSOLIDACIÓN Y MES DE REPORTE
   ================================================================================== */
function consolidarUniverso(){
  const sedes = new Set(), anios = new Set();
  CONFIG.indicadores.forEach(ind => {
    const d = ESTADO.datos[ind.id];
    if (!d || d.estado !== "ok") return;
    d.sedes.forEach(s => sedes.add(s));
    d.anios.forEach(a => anios.add(a));
  });

  const canonicas = CONFIG.sedes.canonicas.filter(s => sedes.has(s));
  const extras = [...sedes].filter(s => !CONFIG.sedes.canonicas.includes(s)).sort((a, b) => a.localeCompare(b, "es"));
  ESTADO.sedes = canonicas.concat(extras);
  ESTADO.anios = [...anios].sort((a, b) => a - b);
  ESTADO.hayComparacion = ESTADO.anios.length > 1;

  const ausentes = CONFIG.sedes.canonicas.filter(s => !sedes.has(s));
  if (ausentes.length) anotar("Sede", "Sin datos en ninguna hoja: " + ausentes.join(", ") + ".");
  if (!ESTADO.hayComparacion && ESTADO.anios.length === 1){
    anotar("Comparación", "Los datos contienen un solo año (" + ESTADO.anios[0] + "); las comparaciones interanuales quedan desactivadas.");
  }
  calcularPeriodoReporte();
}

function ultimoMesCerrado(){
  const hoy = new Date();
  const d = new Date(hoy.getFullYear(), hoy.getMonth() - 1, 1);
  return { anio: d.getFullYear(), mes: d.getMonth() + 1 };
}
function hayDatosEn(anio, mes){
  return CONFIG.indicadores.some(ind => {
    const d = ESTADO.datos[ind.id];
    if (!d || d.estado !== "ok") return false;
    for (const k of d.total.keys()){
      const p = k.split("|");
      if (+p[1] === anio && +p[2] === mes) return true;
    }
    return false;
  });
}
function calcularPeriodoReporte(){
  const objetivo = ultimoMesCerrado();
  ESTADO.periodoSolicitado = objetivo;
  if (hayDatosEn(objetivo.anio, objetivo.mes)){
    ESTADO.periodoReporte = objetivo; ESTADO.retrocedio = false;
  } else {
    let anio = objetivo.anio, mes = objetivo.mes, encontrado = null;
    for (let i = 0; i < 36; i++){
      mes--; if (mes === 0){ mes = 12; anio--; }
      if (hayDatosEn(anio, mes)){ encontrado = { anio, mes }; break; }
    }
    ESTADO.periodoReporte = encontrado || objetivo;
    ESTADO.retrocedio = !!encontrado;
  }
  ESTADO.filtros.mes = ESTADO.periodoReporte.mes;
  ESTADO.filtros.anio = ESTADO.periodoReporte.anio;
}
