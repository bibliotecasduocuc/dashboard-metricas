/** Barra de filtros propios de la vista. */
function filtrosLocalesAF(){
  const d = ESTADO.datos.acciones_formativas;
  const det = d.detalle;
  const f = ESTADO.filtrosAF;
  const opts = (campo, sel, etiquetaTodos) => {
    const valores = det.dicc[campo].slice().sort((a, b) => String(a).localeCompare(String(b), "es"));
    return '<option value="">' + etiquetaTodos + "</option>" +
      valores.map(v => '<option value="' + escapar(v) + '"' + (v === sel ? " selected" : "") + ">" + escapar(v) + "</option>").join("");
  };
  return '<div class="filtros-locales">' +
    '<span class="titulo">Filtros de esta vista</span>' +
    '<select class="control" id="af-actividad" aria-label="Tipo de actividad">' + opts("actividad", f.actividad, "Todos los tipos") + "</select>" +
    '<select class="control" id="af-accion" aria-label="Nombre de la actividad">' + opts("accion", f.accion, "Todas las actividades") + "</select>" +
    '<select class="control" id="af-carrera" aria-label="Carrera">' + opts("carrera", f.carrera, "Todas las carreras") + "</select>" +
    '<select class="control" id="af-ia" aria-label="Taller de IA">' + opts("ia", f.ia, "IA: todas") + "</select>" +
    (hayFiltrosAF() ? '<button type="button" class="limpiar" id="af-limpiar">Limpiar filtros</button>' : "") +
    "</div>";
}
function activarFiltrosLocalesAF(){
  const enlazar = (id, campo) => {
    const el = document.getElementById(id);
    if (el) el.addEventListener("change", () => { ESTADO.filtrosAF[campo] = el.value; renderizar(); });
  };
  enlazar("af-actividad", "actividad");
  enlazar("af-accion", "accion");
  enlazar("af-carrera", "carrera");
  enlazar("af-ia", "ia");
  const limpiar = document.getElementById("af-limpiar");
  if (limpiar) limpiar.addEventListener("click", () => {
    ESTADO.filtrosAF = { actividad: "", accion: "", carrera: "", ia: "" };
    renderizar();
  });
}

function rankingTalleres(id, filas){
  const cont = document.getElementById(id);
  if (!cont) return;
  const det = ESTADO.datos.acciones_formativas.detalle;
  const acum = new Map();
  for (const r of filas){
    const nombre = det.dicc.accion[r.accion];
    let a = acum.get(nombre);
    if (!a){ a = { participaciones: 0, sesiones: new Set() }; acum.set(nombre, a); }
    a.participaciones++;
    a.sesiones.add(r.s + "|" + r.f);
  }
  const lista = [...acum.entries()].map(([nombre, a]) => ({ nombre, participaciones: a.participaciones, sesiones: a.sesiones.size }))
    .sort((a, b) => b.participaciones - a.participaciones).slice(0, CONFIG.criterios.topTalleres);
  if (lista.length === 0){ cont.innerHTML = '<li class="vacio">Sin actividades en el período</li>'; return; }
  cont.innerHTML = lista.map(x =>
    '<li><span class="nom">' + escapar(x.nombre) +
    '<span class="sec"> · ' + x.sesiones + (x.sesiones === 1 ? " sesión" : " sesiones") + "</span></span>" +
    '<span class="num">' + fmtTxt(x.participaciones) + "</span></li>").join("");
}

function tablaDetalleAF(id, filas){
  const cont = document.getElementById(id);
  if (!cont) return;
  const acts = actividadesAF(filas);
  if (acts.length === 0){ cont.innerHTML = '<div class="vacio">Sin actividades en el período seleccionado.</div>'; return; }

  const o = ESTADO.orden.afDetalle;
  if (o){
    const campos = ["accion", "tipo", "sede", "mes", "fecha", "ia", "asistentes"];
    const c = campos[o.col];
    acts.sort((x, y) => (typeof x[c] === "number")
      ? comparar(x[c], y[c], o.dir)
      : String(x[c]).localeCompare(String(y[c]), "es") * o.dir);
  } else {
    acts.sort((a, b) => b.asistentes - a.asistentes);
  }

  let html = '<table class="datos compacta"><thead><tr>' +
    th("Acción formativa", 0, "afDetalle", "izq") + th("Tipo", 1, "afDetalle", "izq") +
    th("Sede", 2, "afDetalle", "izq") + th("Mes", 3, "afDetalle", "izq") +
    th("Fecha", 4, "afDetalle", "izq") + th("IA", 5, "afDetalle", "izq") +
    th("Asistentes", 6, "afDetalle", "") + "</tr></thead><tbody>";
  acts.forEach(a => {
    html += '<tr><td class="izq">' + escapar(a.accion) + "</td>" +
      '<td class="izq normal">' + escapar(a.tipo) + "</td>" +
      '<td class="izq normal">' + escapar(a.sede) + "</td>" +
      '<td class="izq normal">' + nombreMes(a.mes) + "</td>" +
      '<td class="izq normal">' + escapar(a.fecha) + "</td>" +
      '<td class="izq normal">' + escapar(a.ia) + "</td>" +
      "<td>" + fmt(a.asistentes) + "</td></tr>";
  });
  const tot = acts.reduce((t, a) => t + a.asistentes, 0);
  html += "</tbody><tfoot><tr><td class='izq' colspan='6'>" + acts.length + " actividades</td><td>" + fmt(tot) + "</td></tr></tfoot></table>";
  cont.innerHTML = html;
  activarOrden(cont, "afDetalle", () => tablaDetalleAF(id, filas));
}
</script>
<script>
"use strict";
/* ==================================================================================
   TABLAS AUXILIARES
   ================================================================================== */
function th(etiqueta, indice, clave, clases){
  const o = ESTADO.orden[clave];
  let cls = "ordenable " + (clases || "");
  if (o && o.col === indice) cls += o.dir === 1 ? " ord-asc" : " ord-desc";
  const ind = (o && o.col === indice) ? (o.dir === 1 ? "▲" : "▼") : "⇅";
  return '<th class="' + cls.trim() + '" data-col="' + indice + '">' + escapar(etiqueta) + '<span class="ind">' + ind + "</span></th>";
}
function activarOrden(cont, clave, redibujar){
  cont.querySelectorAll("th.ordenable").forEach(el => {
    el.addEventListener("click", () => {
      const col = +el.dataset.col;
      const o = ESTADO.orden[clave];
      ESTADO.orden[clave] = (o && o.col === col) ? { col, dir: -o.dir } : { col, dir: col === 0 ? 1 : -1 };
      redibujar();
    });
  });
}
/** null siempre al final, sin importar la dirección. */
function comparar(a, b, dir){
  const na = (a === null || a === undefined || !Number.isFinite(a));
  const nb = (b === null || b === undefined || !Number.isFinite(b));
  if (na && nb) return 0;
  if (na) return 1;
  if (nb) return -1;
  return (a - b) * dir;
}

/** Tabla simple de un desglose, con porcentaje y barra de proporción. */
function tablaDesglose(id, lista, etiquetaCol, etiquetaValor){
  const cont = document.getElementById(id);
  if (!cont) return;
  if (!lista.length){ cont.innerHTML = '<div class="vacio">Sin datos en el período seleccionado.</div>'; return; }
  const suma = lista.reduce((t, x) => t + x.valor, 0);
  const max = Math.max(...lista.map(x => x.valor));
  let html = '<table class="datos compacta"><thead><tr><th class="izq">' + escapar(etiquetaCol) +
    "</th><th>" + escapar(etiquetaValor) + "</th><th>%</th></tr></thead><tbody>";
  lista.forEach(x => {
    html += '<tr><td class="izq normal">' + escapar(x.etiqueta) + "</td><td>" + fmt(x.valor) +
      '<span class="barra-prop"><i style="width:' + (max ? (x.valor / max) * 100 : 0) + '%"></i></span></td>' +
      "<td>" + pct(x.valor, suma) + "</td></tr>";
  });
  html += "</tbody><tfoot><tr><td class='izq'>Total</td><td>" + fmt(suma) + "</td><td>100,0%</td></tr></tfoot></table>";
  cont.innerHTML = html;
}

/** Proporción de un valor de dimensión sobre el total, por sede. */
function tablaProporcionSede(id, idInd, dim, valorDim, etiqueta, etiquetaPct){
  const cont = document.getElementById(id);
  if (!cont) return;
  const { ref } = anios();
  const meses = mesesSeleccionados();
  const porSede = desglosePorSede(idInd, dim, valorDim, { anio: ref, meses });
  const filas = sedesDe(idInd).map(s => {
    const parte = porSede.get(s) || 0;
    const tot = total(idInd, { anio: ref, meses, sede: s });
    return { sede: s, parte, total: tot, prop: tot ? parte / tot : null };
  }).filter(x => x.total).sort((a, b) => (b.prop || 0) - (a.prop || 0));

  if (!filas.length){ cont.innerHTML = '<div class="vacio">Sin datos.</div>'; return; }
  let html = '<table class="datos compacta"><thead><tr><th class="izq">Sede</th><th>' + escapar(etiqueta) +
    "</th><th>Total</th><th>" + escapar(etiquetaPct) + "</th></tr></thead><tbody>";
  filas.forEach(f => {
    html += '<tr><td class="izq normal">' + escapar(f.sede) + "</td><td>" + fmt(f.parte) + "</td><td>" + fmt(f.total) +
      "</td><td>" + (f.prop === null ? "—" : FMT_DECIMAL.format(f.prop * 100) + "%") +
      '<span class="barra-prop"><i style="width:' + ((f.prop || 0) * 100) + '%"></i></span></td></tr>';
  });
  const tp = filas.reduce((t, f) => t + f.parte, 0), tt = filas.reduce((t, f) => t + f.total, 0);
  html += "</tbody><tfoot><tr><td class='izq'>Sistema</td><td>" + fmt(tp) + "</td><td>" + fmt(tt) +
    "</td><td>" + pct(tp, tt) + "</td></tr></tfoot></table>";
  cont.innerHTML = html;
}

/**
 * Modalidad de atención por sede, para un tipo de transacción concreto.
 * Se usa dos veces: una para préstamos (mesón / autopréstamo) y otra para
 * renovaciones (mesón / autopréstamo / en línea).
 */
function tablaModalidadPorTipo(id, idInd, tipo, modalidades, etiquetaTipo){
  const cont = document.getElementById(id);
  if (!cont) return;
  const { ref } = anios();
  const meses = mesesSeleccionados();
  const porMod = modalidades.map(m => cruzadoPorSede(idInd, "tipoEstacion", tipo, m, { anio: ref, meses }));

  const filas = sedesDe(idInd).map(s => {
    const vals = porMod.map(m => m.get(s) || 0);
    return { sede: s, vals, suma: vals.reduce((a, b) => a + b, 0) };
  }).filter(x => x.suma > 0);

  const claveOrden = "mod_" + norm(tipo).replace(/\W/g, "");
  if (!filas.length){
    cont.innerHTML = '<h3 style="font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px">' +
      escapar(etiquetaTipo) + '</h3><div class="vacio">Sin datos en el período seleccionado.</div>';
    return;
  }

  const o = ESTADO.orden[claveOrden];
  const iAuto = modalidades.findIndex(m => /autoprestamo/.test(norm(m)));
  if (o){
    if (o.col === 0) filas.sort((a, b) => a.sede.localeCompare(b.sede, "es") * o.dir);
    else if (o.col === modalidades.length * 2 + 1) filas.sort((a, b) => comparar(a.suma, b.suma, o.dir));
    else {
      const i = o.col - 1, iMod = Math.floor(i / 2), esPct = (i % 2) === 1;
      filas.sort((a, b) => comparar(esPct ? a.vals[iMod] / a.suma : a.vals[iMod],
                                    esPct ? b.vals[iMod] / b.suma : b.vals[iMod], o.dir));
    }
  } else if (iAuto !== -1){
    /* Por defecto, mayor adopción del autopréstamo primero. */
    filas.sort((a, b) => (b.vals[iAuto] / b.suma) - (a.vals[iAuto] / a.suma));
  }

  const corto = m => {
    const n = norm(m);
    if (n.includes("meson")) return "Mesón";
    if (n.includes("linea")) return "En línea";
    if (n.includes("autoprestamo")) return "Autopréstamo";
    return m;
  };
  const tot = modalidades.map((_, i) => filas.reduce((t, f) => t + f.vals[i], 0));
  const totSuma = tot.reduce((a, b) => a + b, 0);

  let html = '<h3 style="font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px">' +
    escapar(etiquetaTipo) + ' <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--texto-tenue)">· ' +
    fmtTxt(totSuma) + " en total" +
    (iAuto !== -1 ? " · " + pct(tot[iAuto], totSuma) + " por autopréstamo" : "") + "</span></h3>";
  html += '<div class="envoltorio-tabla"><table class="datos compacta"><thead><tr>' + th("Sede", 0, claveOrden, "izq");
  let c = 1;
  modalidades.forEach(m => { html += th(corto(m), c++, claveOrden, "sep-izq") + th("%", c++, claveOrden, ""); });
  html += th("Total", modalidades.length * 2 + 1, claveOrden, "sep-izq") + "</tr></thead><tbody>";
  filas.forEach(f => {
    html += '<tr><td class="izq normal">' + escapar(f.sede) + "</td>";
    f.vals.forEach((v, i) => {
      html += '<td class="sep-izq">' + fmt(v) + "</td><td>" + pct(v, f.suma) +
        (i === iAuto ? '<span class="barra-prop"><i style="width:' + ((v / f.suma) * 100) + '%"></i></span>' : "") + "</td>";
    });
    html += '<td class="sep-izq">' + fmt(f.suma) + "</td></tr>";
  });
  html += "</tbody><tfoot><tr><td class='izq'>Sistema</td>";
  tot.forEach(v => { html += '<td class="sep-izq">' + fmt(v) + "</td><td>" + pct(v, totSuma) + "</td>"; });
  html += '<td class="sep-izq">' + fmt(totSuma) + "</td></tr></tfoot></table></div>";
  cont.innerHTML = html;
  activarOrden(cont, claveOrden, () => tablaModalidadPorTipo(id, idInd, tipo, modalidades, etiquetaTipo));
}

/** Volumen por sede de un valor de dimensión, sin columnas de total ni porcentaje. */
function tablaVolumenSede(id, idInd, dim, valorDim, etiqueta){
  const cont = document.getElementById(id);
  if (!cont) return;
  const { ref } = anios();
  const porSede = desglosePorSede(idInd, dim, valorDim, { anio: ref, meses: mesesSeleccionados() });
  const filas = sedesDe(idInd).map(s => ({ sede: s, valor: porSede.get(s) || 0 }))
                              .filter(x => x.valor > 0).sort((a, b) => b.valor - a.valor);
  if (!filas.length){ cont.innerHTML = '<div class="vacio">Sin datos.</div>'; return; }
  const max = filas[0].valor;
  let html = '<table class="datos compacta"><thead><tr><th class="izq">Sede</th><th>' + escapar(etiqueta) +
    "</th></tr></thead><tbody>";
  filas.forEach(f => {
    html += '<tr><td class="izq normal">' + escapar(f.sede) + "</td><td>" + fmt(f.valor) +
      '<span class="barra-prop"><i style="width:' + (max ? (f.valor / max) * 100 : 0) + '%"></i></span></td></tr>';
  });
  html += "</tbody><tfoot><tr><td class='izq'>Sistema</td><td>" +
    fmt(filas.reduce((t, f) => t + f.valor, 0)) + "</td></tr></tfoot></table>";
  cont.innerHTML = html;
}

/** Matriz sede × mes del indicador, con total del período. */
function tablaMensualPorSede(id, idInd){
  const cont = document.getElementById(id);
  if (!cont) return;
  const { ref } = anios();
  const meses = mesesConDatos(ref);
  const sedes = sedesDe(idInd);
  if (!sedes.length || !meses.length){ cont.innerHTML = '<div class="vacio">Sin datos.</div>'; return; }
  const sel = new Set(mesesSeleccionados());

  const filas = sedes.map(s => ({
    sede: s,
    vals: meses.map(m => total(idInd, { anio: ref, meses: [m], sede: s })),
    tot: total(idInd, { anio: ref, meses: mesesSeleccionados(), sede: s })
  }));

  const o = ESTADO.orden.cpMensual;
  if (o){
    if (o.col === 0) filas.sort((a, b) => a.sede.localeCompare(b.sede, "es") * o.dir);
    else if (o.col === meses.length + 1) filas.sort((a, b) => comparar(a.tot, b.tot, o.dir));
    else filas.sort((a, b) => comparar(a.vals[o.col - 1], b.vals[o.col - 1], o.dir));
  }

  let html = '<table class="datos"><thead><tr>' + th("Sede", 0, "cpMensual", "izq");
  meses.forEach((m, i) => { html += th(CONFIG.mesesCortos[m - 1], i + 1, "cpMensual", sel.has(m) ? "" : ""); });
  html += th("Período", meses.length + 1, "cpMensual", "sep-izq") + "</tr></thead><tbody>";
  filas.forEach(f => {
    html += '<tr><td class="izq">' + escapar(f.sede) + "</td>";
    f.vals.forEach(v => { html += "<td>" + fmt(v) + "</td>"; });
    html += '<td class="sep-izq">' + fmt(f.tot) + "</td></tr>";
  });
  html += "</tbody><tfoot><tr><td class='izq'>Total sistema</td>";
  meses.forEach(m => { html += "<td>" + fmt(total(idInd, { anio: ref, meses: [m] })) + "</td>"; });
  html += '<td class="sep-izq">' + fmt(total(idInd, { anio: ref, meses: mesesSeleccionados() })) + "</td></tr></tfoot></table>";
  cont.innerHTML = html;
  activarOrden(cont, "cpMensual", () => tablaMensualPorSede(id, idInd));
}

/* ==================================================================================
   GRÁFICOS
   ================================================================================== */
Chart.defaults.font.family = "'Lato', sans-serif";
Chart.defaults.font.size = 11;
Chart.defaults.color = "#5B5B66";
/* Animación breve solo al construir: da sensación de respuesta sin entorpecer. */
Chart.defaults.animation = { duration: 380, easing: "easeOutQuart" };
Chart.defaults.animations = { colors: false, x: false };
/* Defensivo: la ruta de transiciones cambió entre versiones de Chart.js. */
try { Chart.defaults.transitions.active.animation.duration = 140; } catch (e){}

/* Línea vertical de seguimiento bajo el cursor, como en las apps de analítica. */
const plugadaSeguimiento = {
  id: "seguimiento",
  afterDatasetsDraw(chart){
    const act = chart.tooltip && chart.tooltip.getActiveElements ? chart.tooltip.getActiveElements() : [];
    if (!act.length) return;
    const x = act[0].element.x;
    const { top, bottom } = chart.chartArea;
    const c = chart.ctx;
    c.save();
    c.beginPath();
    c.setLineDash([3, 3]);
    c.lineWidth = 1;
    c.strokeStyle = "rgba(11,11,13,.28)";
    c.moveTo(x, top); c.lineTo(x, bottom); c.stroke();
    c.restore();
  }
};
if (typeof Chart.register === "function") Chart.register(plugadaSeguimiento);

/** Degradado vertical para el relleno bajo una línea. */
function areaDegradada(chart, color){
  const { ctx: c, chartArea } = chart;
  if (!chartArea) return "rgba(245,168,0,.14)";
  const g = c.createLinearGradient(0, chartArea.top, 0, chartArea.bottom);
  g.addColorStop(0, color.replace("ALFA", ".22"));
  g.addColorStop(1, color.replace("ALFA", "0"));
  return g;
}
/** Degradado vertical para barras. */
function barraDegradada(chart, desde, hasta){
  const { ctx: c, chartArea } = chart;
  if (!chartArea) return hasta;
  const g = c.createLinearGradient(chartArea.left, 0, chartArea.right, 0);
  g.addColorStop(0, desde); g.addColorStop(1, hasta);
  return g;
}

/* Tooltip con elevación y esquinas redondeadas. */
const tooltipRico = {
  backgroundColor: "rgba(11,11,13,.94)", titleFont: { weight: "900", size: 12 },
  bodyFont: { size: 12 }, padding: 12, cornerRadius: 8, displayColors: true,
  boxPadding: 5, caretSize: 6, borderColor: "rgba(255,255,255,.12)", borderWidth: 1,
  titleMarginBottom: 7
};

function destruir(id){
  if (ESTADO.graficos[id]){ ESTADO.graficos[id].destroy(); delete ESTADO.graficos[id]; }
}
function ctx(id){
  const c = document.getElementById(id);
  if (!c) return null;
  destruir(id);
  return c;
}
const ejeY = { beginAtZero: true, grid: { color: "#EFEFF2", drawTicks: false }, border: { display: false },
               ticks: { callback: v => FMT_ENTERO.format(v), padding: 8 } };
const ejeX = { grid: { display: false }, border: { color: "#D2D2D8" }, ticks: { padding: 6 } };
const tooltipBase = tooltipRico;

/* Estilos de serie compartidos: el año anterior en gris punteado y sin relleno;
   el actual en negro con área degradada ámbar, que da profundidad sin competir. */
function serieAnterior(etiqueta, datos){
  return {
    label: etiqueta, data: datos, borderColor: CONFIG.colores.grisSerie,
    backgroundColor: "transparent", borderWidth: 2, borderDash: [5, 4],
    pointRadius: 0, pointHoverRadius: 5, pointHitRadius: 14,
    pointBackgroundColor: CONFIG.colores.grisSerie, pointBorderColor: "#FFFFFF", pointBorderWidth: 2,
    tension: .3, spanGaps: false, order: 2
  };
}
function serieActual(etiqueta, datos){
  return {
    label: etiqueta, data: datos, borderColor: CONFIG.colores.negro,
    backgroundColor: (ctx) => areaDegradada(ctx.chart, "rgba(245,168,0,ALFA)"),
    fill: true, borderWidth: 2.5,
    pointRadius: 0, pointHoverRadius: 7, pointHitRadius: 14,
    pointBackgroundColor: CONFIG.colores.amarillo, pointBorderColor: CONFIG.colores.negro,
    pointBorderWidth: 2, pointHoverBorderWidth: 2.5,
    tension: .3, spanGaps: false, order: 1
  };
}

/** Líneas: año actual vs. año anterior. */
function dibujarEvolucion(idCanvas, idInd, metrica){
  const c = ctx(idCanvas); if (!c) return;
  const { ref, prev, hayPrev } = anios();
  const serieRef = serieMensual(idInd, ref, metrica);
  const seriePrev = hayPrev ? serieMensual(idInd, prev, metrica) : null;
  const datasets = [];
  if (seriePrev) datasets.push(serieAnterior(String(prev), seriePrev));
  datasets.push(serieActual(String(ref), serieRef));

  ESTADO.graficos[idCanvas] = new Chart(c, {
    type: "line",
    data: { labels: CONFIG.mesesCortos, datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: { position: "top", align: "end", labels: { boxWidth: 22, boxHeight: 3, padding: 12, usePointStyle: false } },
        tooltip: Object.assign({}, tooltipBase, { callbacks: {
          title: it => nombreMes(it[0].dataIndex + 1),
          label: it => it.dataset.label + ": " + (it.parsed.y === null ? "sin dato" : FMT_ENTERO.format(it.parsed.y)),
          afterBody: it => {
            if (!seriePrev) return "";
            const v = variacion(serieRef[it[0].dataIndex], seriePrev[it[0].dataIndex]);
            return v === null ? "Variación interanual: n/a"
              : "Variación interanual: " + (v > 0 ? "+" : "") + FMT_DECIMAL.format(v) + "%";
          }
        }})
      },
      scales: { x: ejeX, y: ejeY }
    }
  });
}

/** Evolución de Acciones Formativas, respetando los filtros locales. */
function dibujarEvolucionAF(idCanvas){
  const c = ctx(idCanvas); if (!c) return;
  const { ref, prev, hayPrev } = anios();
  const serieRef = serieAF(ref);
  const seriePrev = hayPrev ? serieAF(prev) : null;
  const datasets = [];
  if (seriePrev) datasets.push(serieAnterior(String(prev), seriePrev));
  datasets.push(serieActual(String(ref), serieRef));

  ESTADO.graficos[idCanvas] = new Chart(c, {
    type: "line",
    data: { labels: CONFIG.mesesCortos, datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: { position: "top", align: "end", labels: { boxWidth: 22, boxHeight: 3, padding: 12, usePointStyle: false } },
        tooltip: Object.assign({}, tooltipBase, { callbacks: {
          title: it => nombreMes(it[0].dataIndex + 1),
          label: it => it.dataset.label + ": " + (it.parsed.y === null ? "sin dato" : FMT_ENTERO.format(it.parsed.y)) + " participaciones"
        }})
      },
      scales: { x: ejeX, y: ejeY }
    }
  });
}

/** Barras horizontales del total por sede, ordenadas de mayor a menor. */
function dibujarBarrasSede(idCanvas, idInd, metrica){
  const { ref, prev, hayPrev } = anios();
  const meses = mesesSeleccionados();
  const filas = sedesDe(idInd).map(s => ({
    etiqueta: s,
    valor: total(idInd, { anio: ref, meses, sede: s }),
    anterior: hayPrev ? total(idInd, { anio: prev, meses, sede: s }) : null
  })).sort((a, b) => comparar(a.valor, b.valor, -1));
  dibujarBarrasHorizontal(idCanvas, filas, "Total", hayPrev ? { prev, etiquetaPrev: String(prev) } : null);
}

/** Serie mensual de un valor concreto de una dimensión (ej. solo PRÉSTAMO). */
function dibujarSerieDimension(idCanvas, idInd, dim, valorDim, etiqueta){
  const c = ctx(idCanvas); if (!c) return;
  const { ref, prev, hayPrev } = anios();
  const serie = (anio) => {
    const s = new Array(12).fill(null);
    for (let m = 1; m <= 12; m++){
      const porSede = desglosePorSede(idInd, dim, valorDim, { anio, meses: [m] });
      let t = null;
      porSede.forEach(v => { t = (t === null ? 0 : t) + v; });
      s[m - 1] = t;
    }
    return s;
  };
  const sRef = serie(ref), sPrev = hayPrev ? serie(prev) : null;
  const datasets = [];
  if (sPrev) datasets.push(serieAnterior(String(prev), sPrev));
  datasets.push(serieActual(String(ref), sRef));

  ESTADO.graficos[idCanvas] = new Chart(c, {
    type: "line",
    data: { labels: CONFIG.mesesCortos, datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: "index", intersect: false },
      plugins: {
        title: { display: true, text: etiqueta, align: "start", font: { weight: "900", size: 11 }, color: "#111" },
        legend: { position: "top", align: "end", labels: { boxWidth: 22, boxHeight: 3, padding: 10, usePointStyle: false } },
        tooltip: Object.assign({}, tooltipBase, { callbacks: {
          title: it => nombreMes(it[0].dataIndex + 1),
          label: it => it.dataset.label + ": " + (it.parsed.y === null ? "sin dato" : FMT_ENTERO.format(it.parsed.y))
        }})
      },
      scales: { x: ejeX, y: ejeY }
    }
  });
}

/** Serie mensual de un par cruzado: por ejemplo, solo los préstamos. */
function dibujarSerieCruzada(idCanvas, idInd, dim, valorA, valorB){
  const c = ctx(idCanvas); if (!c) return;
  const { ref, prev, hayPrev } = anios();
  const sRef = serieCruzada(idInd, dim, valorA, valorB, ref);
  const sPrev = hayPrev ? serieCruzada(idInd, dim, valorA, valorB, prev) : null;
  const datasets = [];
  if (sPrev) datasets.push(serieAnterior(String(prev), sPrev));
  datasets.push(serieActual(String(ref), sRef));

  ESTADO.graficos[idCanvas] = new Chart(c, {
    type: "line",
    data: { labels: CONFIG.mesesCortos, datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: { position: "top", align: "end", labels: { boxWidth: 22, boxHeight: 3, padding: 12, usePointStyle: false } },
        tooltip: Object.assign({}, tooltipBase, { callbacks: {
          title: it => nombreMes(it[0].dataIndex + 1),
          label: it => it.dataset.label + ": " + (it.parsed.y === null ? "sin dato" : FMT_ENTERO.format(it.parsed.y)),
          afterBody: it => {
            if (!sPrev) return "";
            const v = variacion(sRef[it[0].dataIndex], sPrev[it[0].dataIndex]);
            return v === null ? "Variación interanual: n/a"
              : "Variación interanual: " + (v > 0 ? "+" : "") + FMT_DECIMAL.format(v) + "%";
          }
        }})
      },
      scales: { x: ejeX, y: ejeY }
    }
  });
}

/** Barras agrupadas: una serie por indicador, en porcentaje para poder comparar. */
function dibujarComparativoPerfil(idCanvas, series, etiquetas){
  const c = ctx(idCanvas); if (!c) return;
  const cont = c.parentElement;
  if (!etiquetas.length){ cont.innerHTML = '<div class="vacio">Sin datos en el período seleccionado.</div>'; return; }
  const paleta = [CONFIG.colores.negro, CONFIG.colores.amarillo, "#6E6E7A", CONFIG.colores.grisSerie];
  ESTADO.graficos[idCanvas] = new Chart(c, {
    type: "bar",
    data: {
      labels: etiquetas,
      datasets: series.map((s, i) => ({
        label: s.nombre,
        data: etiquetas.map(e => s.pct[e] === undefined ? 0 : s.pct[e]),
        backgroundColor: paleta[i % paleta.length],
        hoverBackgroundColor: ["#3A3A42", "#D99400", "#4A4A54", "#9A9AA6"][i % 4],
        borderColor: "rgba(11,11,13,.10)", borderWidth: i >= 2 ? 1 : 0,
        borderRadius: 3, borderSkipped: false,
        barPercentage: .9, categoryPercentage: .74
      }))
    },
    options: {
      indexAxis: "y", responsive: true, maintainAspectRatio: false,
      interaction: { mode: "index", axis: "y", intersect: false },
      plugins: {
        legend: { position: "top", align: "end",
                  labels: { boxWidth: 12, boxHeight: 12, padding: 12, usePointStyle: true, pointStyle: "rectRounded" } },
        tooltip: Object.assign({}, tooltipBase, { callbacks: {
          label: it => {
            const s = series[it.datasetIndex], e = it.label;
            const abs = s.abs[e] || 0;
            return s.nombre + ": " + FMT_DECIMAL.format(it.parsed.x) + "% (" + FMT_ENTERO.format(abs) + ")";
          }
        }})
      },
      scales: {
        x: { beginAtZero: true, grid: { color: "#EFEFF2", drawTicks: false }, border: { display: false },
             ticks: { callback: v => FMT_DECIMAL.format(v) + "%", padding: 8 } },
        y: { grid: { display: false }, border: { color: "#D2D2D8" },
             ticks: { autoSkip: false, font: { size: 11 }, padding: 6 } }
      }
    }
  });
}

/** Barras por sede de un valor concreto de una dimensión. */
function dibujarBarrasDimensionSede(idCanvas, idInd, dim, valorDim, etiqueta){
  const { ref } = anios();
  const porSede = desglosePorSede(idInd, dim, valorDim, { anio: ref, meses: mesesSeleccionados() });
  const filas = sedesDe(idInd).map(s => ({ etiqueta: s, valor: porSede.get(s) || 0 }))
                              .sort((a, b) => b.valor - a.valor);
  dibujarBarrasHorizontal(idCanvas, filas, etiqueta);
}

/**
 * Barras horizontales genéricas.
 * @param {Array} lista  [{etiqueta, valor, anterior?}]
 */
function dibujarBarrasHorizontal(idCanvas, lista, etiquetaValor, comparacion){
  const c = ctx(idCanvas); if (!c) return;
  const cont = c.parentElement;
  if (!lista.length){ cont.innerHTML = '<div class="vacio">Sin datos en el período seleccionado.</div>'; return; }

  const datasets = [];
  if (comparacion){
    datasets.push({ label: comparacion.etiquetaPrev, data: lista.map(x => x.anterior),
      backgroundColor: CONFIG.colores.grisSerie, hoverBackgroundColor: "#8E8E9A",
      borderWidth: 0, borderRadius: 4, borderSkipped: false,
      barPercentage: .84, categoryPercentage: .74 });
  }
  datasets.push({
    label: etiquetaValor, data: lista.map(x => x.valor),
    /* Degradado horizontal: la barra se enciende hacia su extremo. */
    backgroundColor: (c) => lista[c.dataIndex] && (lista[c.dataIndex].esResto || lista[c.dataIndex].esNoAplica)
      ? barraDegradada(c.chart, "#CFCFD6", "#B5B5B5")
      : barraDegradada(c.chart, "#F5A800", "#FFC24D"),
    hoverBackgroundColor: (c) => barraDegradada(c.chart, "#0B0B0D", "#3A3A42"),
    borderColor: "rgba(11,11,13,.10)", borderWidth: 1,
    borderRadius: 4, borderSkipped: false,
    barPercentage: .84, categoryPercentage: .74
  });

  const suma = lista.reduce((t, x) => t + (x.valor || 0), 0);
  ESTADO.graficos[idCanvas] = new Chart(c, {
    type: "bar",
    data: { labels: lista.map(x => x.etiqueta), datasets },
    options: {
      indexAxis: "y", responsive: true, maintainAspectRatio: false,
      interaction: { mode: "index", axis: "y", intersect: false },
      plugins: {
        legend: { display: !!comparacion, position: "top", align: "end",
                  labels: { boxWidth: 12, boxHeight: 12, padding: 10, usePointStyle: true, pointStyle: "rectRounded" } },
        tooltip: Object.assign({}, tooltipBase, { callbacks: {
          label: it => it.dataset.label + ": " + (it.parsed.x === null ? "sin dato" : FMT_ENTERO.format(it.parsed.x)),
          afterBody: it => {
            const x = lista[it[0].dataIndex];
            const partes = [];
            if (suma) partes.push("Participación: " + pct(x.valor, suma));
            if (comparacion && x.anterior !== null && x.anterior !== undefined){
              const v = variacion(x.valor, x.anterior);
              partes.push("Variación interanual: " + (v === null ? "n/a" : (v > 0 ? "+" : "") + FMT_DECIMAL.format(v) + "%"));
            }
            return partes.join("\n");
          }
        }})
      },
      scales: {
        x: { beginAtZero: true, grid: { color: "#EFEFF2", drawTicks: false }, border: { display: false },
             ticks: { callback: v => FMT_ENTERO.format(v), padding: 8 } },
        y: { grid: { display: false }, border: { color: "#D2D2D8" },
             ticks: { autoSkip: false, font: { size: 10.5 }, padding: 6,
                      callback: function(v){ const t = this.getLabelForValue(v); return t.length > 34 ? t.slice(0, 33) + "…" : t; } } }
      }
    }
  });
}

/** Anillo para distribuciones de pocas categorías. */
function dibujarTorta(idCanvas, lista){
  const c = ctx(idCanvas); if (!c) return;
  const cont = c.parentElement;
  if (!lista.length){ cont.innerHTML = '<div class="vacio">Sin datos en el período seleccionado.</div>'; return; }
  const datos = recortarTop(lista, 8, "Otros");
  const suma = datos.reduce((t, x) => t + x.valor, 0);
  ESTADO.graficos[idCanvas] = new Chart(c, {
    type: "doughnut",
    data: {
      labels: datos.map(x => x.etiqueta),
      datasets: [{ data: datos.map(x => x.valor),
        backgroundColor: datos.map((_, i) => CONFIG.colores.categorias[i % CONFIG.colores.categorias.length]),
        borderColor: "#FFFFFF", borderWidth: 3,
        hoverOffset: 10, hoverBorderColor: "#FFFFFF", hoverBorderWidth: 3 }]
    },
    options: {
      responsive: true, maintainAspectRatio: false, cutout: "58%",
      plugins: {
        legend: { position: "right", labels: { boxWidth: 10, boxHeight: 10, padding: 11,
                  font: { size: 11 }, usePointStyle: true, pointStyle: "circle" } },
        tooltip: Object.assign({}, tooltipBase, { callbacks: {
          label: it => it.label + ": " + FMT_ENTERO.format(it.parsed) + " (" + pct(it.parsed, suma) + ")"
        }})
      }
    }
  });
}

/* ==================================================================================
   EXPORTACIÓN A PDF
   window.print() con hoja @media print dedicada: las tablas salen como tablas reales
   (texto seleccionable, sin pixelado) y los canvas se imprimen a resolución nativa.
   ================================================================================== */
function nombreArchivoPdf(){
  const ind = indicadorDe(ESTADO.vistaActiva);
  const vista = ESTADO.vistaActiva === "resumen" ? "resumen" : (ind ? ind.archivoPdf : ESTADO.vistaActiva);
  const periodo = esAcumulado()
    ? "acumulado-" + ESTADO.filtros.anio
    : CONFIG.meses[ESTADO.filtros.mes - 1].toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "") + "-" + ESTADO.filtros.anio;
  return "bibliotecas-" + vista + "-" + periodo + ".pdf";
}

function exportarPdf(){
  const ind = indicadorDe(ESTADO.vistaActiva);
  document.getElementById("imp-vista").textContent =
    ESTADO.vistaActiva === "resumen" ? "Resumen de indicadores" : (ind ? ind.nombre : "");
  document.getElementById("imp-periodo").textContent = etiquetaSeleccion() + (esAcumulado() ? " (acumulado)" : "");
  document.getElementById("imp-generado").textContent =
    new Date().toLocaleDateString("es-CL") + " a las " +
    new Date().toLocaleTimeString("es-CL", { hour: "2-digit", minute: "2-digit" });
  document.getElementById("imp-filtros").textContent = textoFiltros();

  const titulo = document.title;
  document.title = nombreArchivoPdf().replace(/\.pdf$/, "");
  const restaurar = () => {
    document.title = titulo;
    Object.values(ESTADO.graficos).forEach(g => { try { g.resize(); } catch(e){} });
  };
  Object.values(ESTADO.graficos).forEach(g => { try { g.resize(); } catch(e){} });
  window.addEventListener("afterprint", restaurar, { once: true });
  setTimeout(() => { window.print(); }, 150);
  setTimeout(restaurar, 4000);
}

if (window.matchMedia){
  const mq = window.matchMedia("print");
  const h = () => Object.values(ESTADO.graficos).forEach(g => { try { g.resize(); } catch(e){} });
  if (mq.addEventListener) mq.addEventListener("change", h);
  else if (mq.addListener) mq.addListener(h);
}

/* ==================================================================================
   ARRANQUE
   ================================================================================== */
async function iniciar(){
  const capa = document.getElementById("capa-carga");
  const detalle = document.getElementById("detalle-carga");
  try {
    detalle.textContent = "Descargando y agregando las hojas del libro. La primera carga puede tardar unos segundos.";
    await cargarTodo();
  } catch (e){
    anotar("Sistema", "Error inesperado durante la carga: " + e.message);
  }

  const algunaOk = CONFIG.indicadores.some(i => ESTADO.datos[i.id] && ESTADO.datos[i.id].estado === "ok");
  if (!algunaOk){
    const diagnostico = esOrigenLocal()
      ? "<strong>El dashboard se abrió como archivo local (file://)</strong>" +
        "Por seguridad, el navegador no deja que una página abierta desde el disco descargue datos de Google. " +
        "Necesita servirse desde una dirección web: súbelo a GitHub Pages, o levanta un servidor local con " +
        "<code>python -m http.server 8000</code> y entra a <code>http://localhost:8000</code>."
      : "<strong>No se pudieron cargar los datos</strong>" +
        "Revisa que las hojas sigan publicadas en la web (Archivo → Compartir → Publicar en la web, formato CSV) " +
        "y que los gid de la configuración correspondan a las hojas correctas.<br><br>" +
        CONFIG.indicadores.map(i => {
          const d = ESTADO.datos[i.id];
          return "<strong>" + escapar(i.nombre) + ":</strong> " + escapar(d ? d.error : "sin respuesta");
        }).join("<br>");
    capa.innerHTML = '<div style="max-width:660px;padding:0 24px"><div class="bloque-error">' + diagnostico + "</div></div>";
    return;
  }

  construirMenu();
  construirContenedores();
  construirFiltros();
  renderizar();
  document.getElementById("btn-pdf").addEventListener("click", exportarPdf);
  capa.classList.add("oculta");

  /* Resumen técnico en consola: el saneamiento de datos no se expone en la interfaz. */
  if (DIAGNOSTICO.length){
    console.groupCollapsed("Bibliotecas Duoc UC · diagnóstico de datos (" + DIAGNOSTICO.length + " notas)");
    DIAGNOSTICO.forEach(l => console.log(l));
    console.groupEnd();
  }
}
document.addEventListener("DOMContentLoaded", iniciar);
</script>
